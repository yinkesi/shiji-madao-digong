<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实验史记 · 马刀地宫</title>
<style>
/* 实验史记 · 马刀地宫 —— 夜航鎏金风（源自桌面设计套件 night-transit） */
:root {
  --night: #070b14;
  --panel: #0c1220;
  --panel-2: #101828;
  --line: #1d2941;
  --gold: #c9a45f;
  --gold-bright: #ecd39a;
  --bone: #ece6d7;
  --dim: #7d8aa5;
  --cinnabar: #c14b3a;
  --jade: #5a9c7a;
  --poison: #8aa04f;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--bone);
  font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", "Songti SC", serif;
  overflow: hidden;
  user-select: none;
}
#app { position: relative; width: 100vw; height: 100vh; }
.hidden { display: none !important; }
button { font-family: inherit; }

/* ============ 标题屏 ============ */
#title-screen {
  height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background:
    radial-gradient(1200px 500px at 50% -10%, rgba(201,164,95,.08), transparent 60%),
    radial-gradient(900px 420px at 50% 110%, rgba(193,75,58,.06), transparent 60%),
    var(--night);
  gap: 18px; text-align: center;
}
.t-sup { color: var(--dim); letter-spacing: .5em; font-size: 13px; padding-left: .5em; }
.t-main {
  font-size: clamp(56px, 10vw, 108px); letter-spacing: .18em; padding-left: .18em;
  color: var(--bone); font-weight: 700;
  text-shadow: 0 0 24px rgba(201,164,95,.25), 0 2px 0 rgba(0,0,0,.6);
}
.t-sub { color: var(--dim); max-width: 560px; line-height: 1.9; font-size: 14px; }
.t-btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
.t-btn {
  background: var(--panel); color: var(--bone); border: 1px solid var(--line);
  padding: 12px 26px; font-size: 16px; letter-spacing: .2em; padding-left: calc(26px + .2em);
  cursor: pointer; transition: all .18s ease;
}
.t-btn:hover { border-color: var(--gold); color: var(--gold-bright); transform: translateY(-1px); }
.t-btn.primary { border-color: var(--gold); color: var(--gold-bright); background: linear-gradient(180deg, rgba(201,164,95,.12), rgba(201,164,95,.03)); }
.t-meta { color: var(--dim); font-size: 13px; margin-top: 8px; }
.t-meta b { color: var(--gold); }
.t-foot { color: #3d4a63; font-size: 12px; letter-spacing: .3em; margin-top: 16px; }

/* ============ 序章 ============ */
#prologue-screen { display: flex; align-items: center; justify-content: center; }
#pro-box { max-width: 640px; padding: 30px 26px; }
.pro-sup { color: var(--dim); letter-spacing: .6em; font-size: 14px; margin-bottom: 22px; text-align: center; }
#pro-pages p {
  color: var(--bone); font-size: 17px; line-height: 2.3; margin-bottom: 4px;
  text-shadow: 0 1px 2px rgba(0,0,0,.5);
  animation: propage .5s ease;
}
@keyframes propage { from { opacity: 0; transform: translateY(8px); } }
.pro-ctl { display: flex; align-items: center; gap: 14px; margin-top: 30px; justify-content: flex-end; }
#pro-ind { color: var(--dim); font-size: 13px; letter-spacing: .2em; }
.pro-hint { color: #3d4a63; font-size: 12px; margin-right: auto; }
.pro-ctl .t-btn { padding: 8px 18px; font-size: 14px; }

/* ============ 入宫设置 ============ */
.screen { position: absolute; inset: 0; overflow: auto; padding: 40px 24px; background: var(--night); }
#setup-screen { max-width: 860px; margin: 0 auto; }
.s-title { color: var(--gold-bright); letter-spacing: .5em; font-size: 30px; margin-bottom: 20px; }
.s-sec { color: var(--dim); margin: 22px 0 10px; letter-spacing: .15em; border-left: 3px solid var(--gold); padding-left: 10px; }
.runner-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.runner-card {
  display: flex; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--line);
  padding: 12px; cursor: pointer; transition: border-color .15s;
}
.runner-card:hover { border-color: var(--gold); }
.runner-card.sel { border-color: var(--gold-bright); background: var(--panel-2); }
.runner-card.off { opacity: .4; cursor: not-allowed; }
.face {
  width: 44px; height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
  font-size: 22px; color: #fff; flex: none; text-shadow: 0 1px 2px rgba(0,0,0,.7);
}
.runner-card h4 { color: var(--bone); font-size: 15px; }
.runner-card h4 em { color: var(--gold); font-style: normal; font-size: 12px; margin-left: 6px; }
.runner-card .meta { color: var(--dim); font-size: 12px; margin-top: 3px; line-height: 1.5; }
.diff-row { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); padding: 10px 14px; cursor: pointer; margin-bottom: 6px; }
.diff-row.sel { border-color: var(--gold-bright); }
.diff-row b { color: var(--gold-bright); width: 60px; }
.diff-row span { color: var(--dim); font-size: 13px; }
.s-btns { margin-top: 26px; display: flex; gap: 12px; }

/* ============ 游戏屏 ============ */
#game-screen { padding: 0; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#hud-top {
  position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 16px;
  padding: 10px 14px; background: linear-gradient(180deg, rgba(7,11,20,.92), rgba(7,11,20,.55) 80%, transparent);
  pointer-events: none;
}
#hud-top > * { pointer-events: auto; }
#hud-floor { display: flex; align-items: baseline; gap: 8px; min-width: 280px; }
#hud-floor-num { color: var(--gold); font-size: 13px; }
#hud-floor-name { color: var(--bone); font-size: 19px; letter-spacing: .1em; }
.rule-tag {
  font-size: 12px; color: var(--cinnabar); border: 1px solid rgba(193,75,58,.5);
  padding: 2px 8px; border-radius: 3px; background: rgba(193,75,58,.08);
}
.hud-bars { flex: 1; max-width: 380px; }
.bar { position: relative; height: 18px; background: rgba(12,18,32,.85); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.bar.sub { height: 14px; margin-top: 4px; background: transparent; border: none; }
#bar-hp { height: 100%; background: linear-gradient(90deg, #a03d2e, var(--cinnabar)); transition: width .25s ease; }
.bar span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--bone); text-shadow: 0 1px 2px #000; }
#bar-emp { height: 100%; background: linear-gradient(90deg, #8a6a2c, var(--gold)); opacity: .8; transition: width .25s ease; }
#bar-shield { color: var(--gold-bright); font-size: 12px; }
#hud-money { color: var(--dim); font-size: 14px; }
#hud-money b { color: var(--gold-bright); }
#hud-btns { display: flex; gap: 8px; }
.hbtn {
  background: var(--panel); border: 1px solid var(--line); color: var(--dim);
  padding: 6px 12px; cursor: pointer; font-size: 13px; letter-spacing: .1em;
}
.hbtn:hover { color: var(--gold-bright); border-color: var(--gold); }
#minimap { position: absolute; top: 76px; right: 14px; border: 1px solid var(--line); background: rgba(7,11,20,.85); border-radius: 4px; }
#skillbar {
  position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 8px; align-items: flex-end;
}
.skill {
  position: relative; width: 84px; height: 58px; background: rgba(12,18,32,.9); border: 1px solid var(--line);
  cursor: pointer; text-align: center; padding-top: 6px; border-radius: 4px; transition: border-color .15s;
}
.skill:hover { border-color: var(--gold); }
.skill.armed { border-color: var(--gold-bright); box-shadow: 0 0 10px rgba(236,211,154,.25); }
.skill b { color: var(--gold-bright); font-size: 13px; display: block; }
.skill i { color: var(--dim); font-size: 11px; font-style: normal; }
.skill .key { position: absolute; top: 2px; left: 5px; color: var(--dim); font-size: 10px; }
.skill .cd { position: absolute; inset: 0; background: rgba(7,11,20,.78); color: var(--gold-bright); display: flex; align-items: center; justify-content: center; font-size: 18px; border-radius: 4px; }
#log {
  position: absolute; right: 14px; bottom: 90px; width: 300px; max-height: 260px; overflow: hidden;
  display: flex; flex-direction: column; justify-content: flex-end; pointer-events: none;
  font-size: 13px; line-height: 1.7;
}
#log .ln { color: var(--dim); text-shadow: 0 1px 3px #000; animation: lnin .25s ease; }
#log .ln.hot { color: var(--gold-bright); }
#log .ln.bad { color: #d0705f; }
@keyframes lnin { from { opacity: 0; transform: translateY(6px); } }

/* 层卡与 Boss 卡 */
#floor-card, #boss-card {
  position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%); text-align: center;
  pointer-events: none; animation: cardin 2.8s ease forwards;
}
#floor-card { }
#fc-num { color: var(--gold); font-size: 16px; letter-spacing: .6em; padding-left: .6em; }
#fc-name { color: var(--bone); font-size: 44px; letter-spacing: .3em; padding-left: .3em; text-shadow: 0 0 30px rgba(201,164,95,.3); }
#fc-intro { color: var(--dim); margin-top: 10px; max-width: 520px; line-height: 1.8; }
#bc-name { color: var(--cinnabar); font-size: 40px; letter-spacing: .2em; text-shadow: 0 0 26px rgba(193,75,58,.4); }
#bc-line { color: var(--dim); margin-top: 8px; font-size: 15px; }
@keyframes cardin { 0% { opacity: 0; } 12% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }

/* ============ 面板 ============ */
#panel-mask { position: absolute; inset: 0; background: rgba(4,7,13,.72); display: flex; align-items: center; justify-content: center; z-index: 40; }
#panel {
  width: min(680px, 92vw); max-height: 84vh; overflow: auto; background: var(--panel);
  border: 1px solid var(--gold); box-shadow: 0 20px 60px rgba(0,0,0,.6);
}
#panel-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
#panel-title { color: var(--gold-bright); letter-spacing: .3em; }
#panel-close { background: none; border: 1px solid var(--line); color: var(--dim); width: 28px; height: 28px; cursor: pointer; }
#panel-close:hover { color: var(--cinnabar); border-color: var(--cinnabar); }
#panel-body { padding: 16px 18px; line-height: 1.8; }
#panel-body h5 { color: var(--dim); margin: 12px 0 6px; letter-spacing: .2em; }
#panel-body .row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); margin-bottom: 6px; background: var(--panel-2); }
#panel-body .row .grow { flex: 1; }
#panel-body .row b { color: var(--gold-bright); }
#panel-body .muted { color: var(--dim); font-size: 13px; }
#panel-body .pbtn { background: none; border: 1px solid var(--gold); color: var(--gold); padding: 4px 12px; cursor: pointer; font-size: 13px; }
#panel-body .pbtn:hover { color: var(--gold-bright); }
#panel-body .pbtn:disabled { opacity: .35; cursor: not-allowed; }
#panel-body .gold { color: var(--gold-bright); }
#panel-body .cin { color: var(--cinnabar); }

/* ============ 终局 ============ */
#end-screen { display: flex; align-items: center; justify-content: center; }
#end-box { width: min(620px, 92vw); background: var(--panel); border: 1px solid var(--gold); padding: 34px 38px; }
#end-box h2 { color: var(--gold-bright); letter-spacing: .4em; font-size: 30px; margin-bottom: 16px; }
#end-box h2.lost { color: var(--cinnabar); }
#end-box .line { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--line); padding: 7px 0; color: var(--dim); }
#end-box .line b { color: var(--bone); }
#end-box .yueks { color: var(--gold); margin-top: 16px; line-height: 1.9; font-size: 14px; }
#end-box .s-btns { display: flex; gap: 12px; margin-top: 22px; }
.unlocks { margin-top: 14px; }
.unlocks .row b { color: var(--gold-bright); }

/* toast */
#toasts { position: absolute; top: 74px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 60; pointer-events: none; }
.toast {
  background: rgba(12,18,32,.95); border: 1px solid var(--gold); color: var(--gold-bright);
  padding: 8px 20px; font-size: 14px; letter-spacing: .1em; animation: toastin .25s ease;
}
@keyframes toastin { from { opacity: 0; transform: translateY(-8px); } }

@media (max-width: 900px) {
  #log { display: none; }
  #minimap { display: none; }
  #hud-floor { min-width: 0; }
}

</style>
</head>
<body>
<div id="app">

  <!-- ============ 序章（承前作 · 为何入宫） ============ -->
  <div id="prologue-screen" class="screen hidden">
    <div id="pro-box">
      <div class="pro-sup">序</div>
      <div id="pro-pages"></div>
      <div class="pro-ctl">
        <span id="pro-ind"></span>
        <span class="pro-hint">空格 翻页</span>
        <button class="t-btn" id="pro-skip">跳过</button>
        <button class="t-btn primary" id="pro-next">翻页</button>
      </div>
    </div>
  </div>

  <!-- ============ 标题屏 ============ -->
  <div id="title-screen">
    <div class="t-sup">据 音克思《实验史记》改编 · 终卷</div>
    <h1 class="t-main">马刀地宫</h1>
    <div class="t-sub">重翻旧稿，梦入卷底——记忆化作九层地宫，人人还在原地。——既毕业，无复有刀者；然记忆九层，刀声未绝。</div>
    <div class="t-btns">
      <button class="t-btn primary" id="btn-new">入宫 · 新的一轮</button>
      <button class="t-btn" id="btn-resume">续行</button>
      <button class="t-btn" id="btn-cult">修炼</button>
      <button class="t-btn" id="btn-why">序 · 为何入宫</button>
      <button class="t-btn" id="btn-help">观卷 · 玩法</button>
    </div>
    <div class="t-meta">文脉 <b id="t-wemai">0</b> · 收卷 <span id="t-wins">0</span> 次 · 最深至第 <span id="t-floor">—</span> 层 · 名册 <span id="t-runners">1</span> 人</div>
    <div class="t-foot">零依赖 · 双击即玩 · 进度自动保存</div>
  </div>

  <!-- ============ 入宫设置（选将 / 难度） ============ -->
  <div id="setup-screen" class="screen hidden">
    <h2 class="s-title">入宫</h2>
    <div class="s-sec">点将出征 —— 谁执此刀？</div>
    <div id="setup-runners" class="runner-grid"></div>
    <div class="s-sec">难度 —— 敌之强度与文脉之倍率</div>
    <div id="setup-diffs"></div>
    <div class="s-btns">
      <button class="t-btn primary" id="btn-start">提刀 · 入梦</button>
      <button class="t-btn" id="btn-setup-back">回题名</button>
    </div>
  </div>

  <!-- ============ 游戏屏 ============ -->
  <div id="game-screen" class="screen hidden">
    <canvas id="cv"></canvas>
    <div id="hud-top">
      <div id="hud-floor"><span id="hud-floor-num">第一层</span><b id="hud-floor-name">跑道之下</b><span id="hud-rule" class="rule-tag"></span></div>
      <div class="hud-bars">
        <div class="bar hp"><div id="bar-hp"></div><span id="bar-hp-text">18/18</span></div>
        <div class="bar sub"><div id="bar-emp"></div><span id="bar-shield"></span></div>
      </div>
      <div id="hud-money">钱 <b id="hud-cash">12</b> · 文脉 <b id="hud-wemai">0</b> · <span id="hud-kills">斩 0</span></div>
      <div id="hud-btns">
        <button class="hbtn" id="btn-bag" title="行囊（I）">行囊</button>
        <button class="hbtn" id="btn-blades" title="刀谱（K）">刀谱</button>
        <button class="hbtn" id="btn-dex" title="图鉴（J）">图鉴</button>
        <button class="hbtn" id="btn-sys" title="设置（Esc）">系统</button>
      </div>
    </div>
    <canvas id="minimap" width="156" height="120"></canvas>
    <div id="skillbar"></div>
    <div id="log"></div>
    <div id="floor-card" class="hidden"><div id="fc-num"></div><div id="fc-name"></div><div id="fc-intro"></div></div>
    <div id="boss-card" class="hidden"><div id="bc-name"></div><div id="bc-line"></div></div>
  </div>

  <!-- ============ 面板 ============ -->
  <div id="panel-mask" class="hidden">
    <div id="panel">
      <div id="panel-head"><span id="panel-title"></span><button id="panel-close">✕</button></div>
      <div id="panel-body"></div>
    </div>
  </div>

  <!-- ============ 终局结算 ============ -->
  <div id="end-screen" class="screen hidden">
    <div id="end-box"></div>
  </div>

  <div id="toasts"></div>
</div>

<!-- 核心层（不碰 DOM，Node 可直测；顺序即依赖序） -->
<script>
/* ============================================================
 * 实验史记 · 马刀地宫 —— 随机数卷
 * 可播种 RNG：同一种子必出同一座地宫（测试与「重走此局」的根基）。
 * 核心层文件：不碰 DOM/window，Node 可直测。
 * 挂载：MDG.RNG
 * ============================================================ */
(function (ROOT) {
  "use strict";

  /* mulberry32：32 位播种 PRNG，短小、统计够用、天生可序列化。
     state 是共享的内部状态盒 {a}——存档时把 state 一并入库，续局用
     RNG.from(state) 接着摇，随机序列分毫不差。seedOf() 从字符串导出
     数值种子（同一串字永远同一宫）。 */
  function rngFrom(state) {
    return function () {
      state.a = (state.a + 0x6D2B79F5) | 0;
      let t = Math.imul(state.a ^ (state.a >>> 15), 1 | state.a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function mulberry32(state) {
    if (typeof state === "object" && state !== null && "a" in state) return rngFrom(state);
    return rngFrom({ a: state >>> 0 });
  }
  function seedOf(str) {
    str = String(str);
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  /* 造一个 RNG 对象：next()∈[0,1)，int(a,b) 双闭区间，pick/chance/shuffle。
     make(seed) 新起一局；from(stateObj) 续用既有状态（存档恢复）。 */
  function buildR(next, seed) {
    return {
      seed,
      state: next.state,
      next,
      int(a, b) { return a + Math.floor(next() * (b - a + 1)); },
      pick(arr) { return arr[Math.floor(next() * arr.length)]; },
      chance(p) { return next() < p; },
      shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(next() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
        return a;
      }
    };
  }
  function make(seed) {
    const state = { a: (typeof seed === "string" ? seedOf(seed) : (seed >>> 0)) };
    const next = rngFrom(state); next.state = state;
    return buildR(next, typeof seed === "string" ? seed : (seed >>> 0));
  }
  function from(stateObj) {
    const next = rngFrom(stateObj); next.state = stateObj;
    return buildR(next, stateObj.a);
  }

  ROOT.MDG = ROOT.MDG || {};
  ROOT.MDG.RNG = { make, from, seedOf, mulberry32 };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* ============================================================
 * 实验史记 · 马刀地宫 —— 格网卷
 * 瓦片地图、视线（Bresenham）、广度寻路、视野（FOV）。
 * 瓦片码：0 墙 / 1 宫室地面 / 2 走廊 / 3 下行梯 / 4 木箱 / 5 史料 /
 *         6 灶间 / 7 树（可击碎的堵路物）/ 8 商摊
 * 核心层文件：不碰 DOM，Node 可直测。挂载：MDG.Grid
 * ============================================================ */
(function (ROOT) {
  "use strict";

  const WALL = 0, FLOOR = 1, CORR = 2, STAIRS = 3, CHEST = 4, SCROLL = 5, CAMPFIRE = 6, TREE = 7, SHOP = 8;

  function makeMap(w, h) {
    const tiles = new Array(w * h).fill(WALL);
    return { w, h, tiles, rooms: [], spawn: null, stairs: null };
  }
  const idx = (m, x, y) => y * m.w + x;
  const inB = (m, x, y) => x >= 0 && y >= 0 && x < m.w && y < m.h;
  const at = (m, x, y) => inB(m, x, y) ? m.tiles[idx(m, x, y)] : WALL;
  const set = (m, x, y, t) => { if (inB(m, x, y)) m.tiles[idx(m, x, y)] = t; };

  /* 通行的判定：墙与树不可通行；箱子/灶间/商摊/楼梯是"可站上但要交互"的实体格。 */
  function walkable(m, x, y) {
    const t = at(m, x, y);
    return t !== WALL && t !== TREE;
  }

<script>
/* ============================================================
 * 实验史记 · 马刀地宫 —— 营造卷（地宫生成）
 * 房间 + 走廊 + 环路；楼梯放在离出生点最远的宫室；Boss 镇于梯旁，
 * 精英游荡、杂兵散布；灶间/小卖部/木箱/史料各有安置。
 * 同一种子必生成同一座宫，且自检连通（不通则换子种子重营）。
 * 核心层文件：不碰 DOM，Node 可直测。挂载：MDG.Gen
 * ============================================================ */
(function (ROOT) {
  "use strict";
  const G3 = () => ROOT.MDG.Grid;
  const R2 = () => ROOT.MDG.RNG;

  /* 在矩形房内随机取一个空地格（避开房心——房心是走廊节点，留给交通） */
  function roomSpot(map, room, R, taken) {
    for (let i = 0; i < 40; i++) {
      const x = R.int(room.x, room.x + room.w - 1), y = R.int(room.y, room.y + room.h - 1);
      if (x === room.cx && y === room.cy) continue;
      const key = y * map.w + x;
      if (!taken.has(key) && G3().at(map, x, y) === G3().FLOOR) { taken.add(key); return [x, y]; }
    }
    return null;
  }

  function carveCorridor(map, x0, y0, x1, y1, R) {
    let [cx, cy] = [x0, y0];
    const horizFirst = R.chance(0.5);
    const hseg = () => { while (cx !== x1) { cx += Math.sign(x1 - cx); if (G3().at(map, cx, cy) === G3().WALL) G3().set(map, cx, cy, G3().CORR); } };
    const vseg = () => { while (cy !== y1) { cy += Math.sign(y1 - cy); if (G3().at(map, cx, cy) === G3().WALL) G3().set(map, cx, cy, G3().CORR); } };
    if (horizFirst) { hseg(); vseg(); } else { vseg(); hseg(); }
  }

  /* 单次营造：返回 map 或 null（房间摆不下/不连通时） */
  function buildOnce(def, R) {
    const G = G3();
    const w = Math.min(44, 28 + def.n * 2), h = Math.min(26, 18 + def.n);
    const map = G.makeMap(w, h);
    const target = Math.min(10, 6 + def.n);
    /* 1) 摆房：重叠（留一格缓冲）即弃 */
    for (let t = 0; t < 160 && map.rooms.length < target; t++) {
      const rw = R.int(4, 8), rh = R.int(4, 6);
      const rx = R.int(1, w - rw - 2), ry = R.int(1, h - rh - 2);
      const clash = map.rooms.some(r => rx < r.x + r.w + 1 && rx + rw + 1 > r.x && ry < r.y + r.h + 1 && ry + rh + 1 > r.y);
      if (clash) continue;
      for (let y = ry; y < ry + rh; y++) for (let x = rx; x < rx + rw; x++) G.set(map, x, y, G.FLOOR);
      map.rooms.push({ x: rx, y: ry, w: rw, h: rh, cx: rx + (rw >> 1), cy: ry + (rh >> 1) });
    }
    if (map.rooms.length < 4) return null;
    /* 2) 串房成廊 + 两道环路 */
    const order = map.rooms.slice().sort((a, b) => (a.cx + a.cy) - (b.cx + b.cy));
    for (let i = 1; i < order.length; i++) carveCorridor(map, order[i - 1].cx, order[i - 1].cy, order[i].cx, order[i].cy, R);
    for (let i = 0; i < 2; i++) {
      const a = R.pick(order), b = R.pick(order);
      if (a !== b) carveCorridor(map, a.cx, a.cy, b.cx, b.cy, R);
    }
    /* 3) 出生点在首房；楼梯放 BFS 最远的房心 */
    const spawnRoom = order[0];
    map.spawn = [spawnRoom.cx, spawnRoom.cy];
    const df = G.distField(map, spawnRoom.cx, spawnRoom.cy);
    let best = null, bestD = -1;
    map.rooms.forEach(r => {
      const d = df[r.cy * w + r.cx];
      if (d > bestD) { bestD = d; best = r; }
    });
    if (bestD < 6) return null; // 太挤，重营
    /* 楼梯放在最远房的非中心格——房心是走廊节点，梯不可堵路 */
    {
      const cand = [];
      for (let y = best.y; y < best.y + best.h; y++) for (let x = best.x; x < best.x + best.w; x++) {
        if (x === best.cx && y === best.cy) continue;
        if (G.at(map, x, y) === G.FLOOR) cand.push([x, y]);
      }
      map.stairs = cand.length ? cand[R.int(0, cand.length - 1)] : [best.cx, best.cy];
    }
    G.set(map, map.stairs[0], map.stairs[1], G.STAIRS);
    map.stairsRoom = best;
    return map;
  }

  /* 营造一层：返回 {map, places}，places 里给出各实体的落点（引擎负责造人）。
     places: boss/[x,y]、elites [[chId,x,y]]、mobs [[x,y]]、campfire、shop、
             chests [[x,y]]、scrolls [[x,y,id]]、trees [[x,y]] */
  function genFloor(seedStr, def) {
    const R = R2().make(seedStr + "|" + def.name);
    let map = null;
    for (let k = 0; k < 12 && !map; k++) map = buildOnce(def, R2().make(seedStr + "|" + def.name + "#" + k));
    if (!map) throw new Error("gen failed: " + seedStr + " " + def.name);
    const G = G3();
    const places = { elites: [], mobs: [], chests: [], scrolls: [], trees: [], campfire: null, shop: null, boss: null };
    const taken = new Set();
    taken.add(map.spawn[1] * map.w + map.spawn[0]);
    taken.add(map.stairs[1] * map.w + map.stairs[0]);
    const df = G.distField(map, map.spawn[0], map.spawn[1]);
    const far = (x, y, minD) => df[y * map.w + x] >= minD;
    const free = (x, y) => !taken.has(y * map.w + x) && G.walkable(map, x, y) && far(x, y, 4);

    /* Boss 镇守于楼梯旁 */
    {
      const [sx, sy] = map.stairs;
      const spot = G.DIRS.map(([dx, dy]) => [sx + dx, sy + dy])
        .find(([x, y]) => G.inB(map, x, y) && G.walkable(map, x, y) && !taken.has(y * map.w + x));
      if (spot) { places.boss = spot; taken.add(spot[1] * map.w + spot[0]); }
      else { places.boss = [sx, sy - 1]; }
    }
    /* 精英：各占一间远房 */
    const farRooms = map.rooms.filter(r => !(r === map.stairsRoom) && df[r.cy * map.w + r.cx] >= 7);
    def.elites.forEach((chId, i) => {
      const room = farRooms.length ? farRooms[(i * 3 + 1) % farRooms.length] : R.pick(map.rooms);
      const spot = roomSpot(map, room, R, taken) || roomSpot(map, R.pick(map.rooms), R, taken);
      if (spot) places.elites.push([chId, spot[0], spot[1]]);
    });
    /* 杂兵 */
    for (let i = 0; i < def.mobs; i++) {
      for (let t = 0; t < 40; t++) {
        const x = R.int(1, map.w - 2), y = R.int(1, map.h - 2);
        if (G.at(map, x, y) === G.FLOOR && free(x, y) && far(x, y, 6)) { places.mobs.push([x, y]); taken.add(y * map.w + x); break; }
      }
    }
    /* 灶间：既非出生房也非楼梯房 */
    {
      const midRooms = map.rooms.filter(r => r !== map.stairsRoom && !(r.cx === map.spawn[0] && r.cy === map.spawn[1]));
      const room = midRooms.length ? R.pick(midRooms) : R.pick(map.rooms);
      const spot = roomSpot(map, room, R, taken);
      if (spot) { G.set(map, spot[0], spot[1], G.CAMPFIRE); places.campfire = spot; }
    }
    /* 小卖部 */
    if (def.shop) {
      const room = R.pick(map.rooms);
      const spot = roomSpot(map, room, R, taken);
      if (spot) { G.set(map, spot[0], spot[1], G.SHOP); places.shop = spot; }
    }
    /* 木箱与史料：箱子只进房间（免堵走廊），史料可落于廊中（走过即拾） */
    const chestN = 2 + Math.floor(def.n / 2);
    const allRooms = map.rooms.slice();
    for (let i = 0; i < chestN; i++) {
      const spot = roomSpot(map, R.pick(allRooms), R, taken) || roomSpot(map, R.pick(allRooms), R, taken);
      if (spot) { places.chests.push(spot); }
    }
    const scrollN = 2 + (def.n % 2);
    for (let i = 0; i < scrollN; i++) {
      for (let t = 0; t < 40; t++) {
        const x = R.int(1, map.w - 2), y = R.int(1, map.h - 2);
        if (G.at(map, x, y) === G.FLOOR && free(x, y)) {
          places.scrolls.push([x, y, "f" + def.n + "s" + i]); taken.add(y * map.w + x); break;
        }
      }
    }
    for (let i = 0; i < places.scrolls.length; i++) {
      const s = places.scrolls[i]; G.set(map, s[0], s[1], G.SCROLL);
    }
    /* 崇国庭：先种两株树 */
    if (def.rule === "zhongshu") {
      for (let i = 0; i < 2; i++) {
        for (let t = 0; t < 40; t++) {
          const x = R.int(1, map.w - 2), y = R.int(1, map.h - 2);
          if (G.at(map, x, y) === G.FLOOR && free(x, y) && far(x, y, 5)) {
            G.set(map, x, y, G.TREE); places.trees.push([x, y]); taken.add(y * map.w + x); break;
          }
        }
      }
    }
    return { map, places };
  }

  /* 连通性自检：出生点能到楼梯、灶间、商摊与所有实体格 */
  function sane(map) {
    const G = G3();
    const df = G.distField(map, map.spawn[0], map.spawn[1]);
    const ok = (p) => p && df[p[1] * map.w + p[0]] >= 0;
    if (!ok(map.stairs)) return false;
    for (let y = 0; y < map.h; y++) for (let x = 0; x < map.w; x++) {
      const t = G.at(map, x, y);
      if ((t === G.CAMPFIRE || t === G.SHOP || t === G.CHEST || t === G.SCROLL) && df[y * map.w + x] < 0) return false;
    }
    return true;
  }

  ROOT.MDG = ROOT.MDG || {};
  ROOT.MDG.Gen = { genFloor, sane };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* ============================================================
 * 实验史记 · 马刀地宫 —— 引擎卷（回合制地宫战）
 * 走一步、世界走一步：玩家一动（移动/刀击/用技/用物/待机/撞格互动），
 * 尔后惊动之敌各动一步；回合始末结算各层特则与诸状态。
 * 本文件是全作的「规矩」：不碰 DOM，Node 可直测；所有随机经 G.r
 * （可播种、可存档续局）。挂载：MDG.Engine
 *
 * 【事件流】act() 返回事件数组 ev，表现层按事件播动画、测试按事件断言：
 *   move/die/hit/miss/learn/alert/tree/bottle/summon/chest/camp/scroll/
 *   shop/descend/stairsLocked/log/win/dead …
 * ============================================================ */
(function (ROOT) {
  "use strict";
  const MDG = ROOT.MDG = ROOT.MDG || {};
  const G3 = () => MDG.Grid, D2 = () => MDG.DATA, G4 = () => MDG.Gen;

  /* ---------------- 造人 ---------------- */
  let UID = 1;
  function makeUnit(chId, x, y, opts) {
    const ch = D2().CH(chId);
    opts = opts || {};
    const u = {
      uid: "u" + (UID++), chId, name: ch.name, glyph: ch.glyph, color: ch.color,
      side: opts.side || "e", x, y,
      hp: ch.hp, maxHp: ch.hp, dmg: ch.dmg || 1,
      saw: ch.saw || 6, moveRange: (ch.passive && ch.passive.moveRange) || 1,
      passive: ch.passive || null,
      skills: [],
      st: { stun: 0, disarm: 0, poison: 0, shield: 0, emp: 0, grudge: 0, buffKnife: 0 },
      /* boss 身份由入层时的落位显式给定（同一人可镇守一层、又为别层精英） */
      boss: !!opts.boss, elite: !!opts.elite, mob: !!ch.mob,
      aggro: false, dead: false, lethalUsed: false, firstHitTaken: false,
      bossTag: opts.bossTag || null
    };
    return u;
  }
  function addSkill(u, skillDef) {
    if (!skillDef || skillDef.kind === "summon" && u.side === "p") return; // 种树不录
    if (u.skills.some(s => s.id === skillDef.id)) return;
    u.skills.push(Object.assign({ cdLeft: 0 }, skillDef));
  }

  /* ---------------- 开局 ---------------- */
  /* meta：修炼加成 {fist, body, purse, appetite, hearth, blood, guard, royalty} */
  function newRunState(opts) {
    const D = D2();
    const seed = opts.seed || ("gong-" + Date.now());
    const diff = D.DIFF_BY_V[opts.diffV] ? opts.diffV : "normal";
    const meta = opts.meta || {};
    const runner = D.CH(opts.runnerId || "yinkesi");
    if (!runner || !runner.runner) throw new Error("bad runner: " + opts.runnerId);
    const G = {
      v: 1, seed, diff, runnerId: runner.id, floorIdx: 0, round: 1,
      money: 12 + (meta.purse || 0) * 10,
      learned: {},          // chId -> true（本轮已录技）
      learnedSkills: [],    // 已录主动技 id
      relics: [], items: [{ id: "fantuan", n: 2 }],
      kills: 0, eliteKills: 0, bossKills: [], scrollsGot: [], scrollsTotal: 0,
      wemai: 0, firstClears: [], unlockedThisRun: [], achieveFlags: {},
      over: false, won: false, summary: null,
      map: null, player: null, enemies: [], floorDef: null, campUsed: false, key: false,
      ev: [],
      rs: { a: MDG.RNG.seedOf(seed) ^ 0x9e3779b9 }
    };
    G.r = MDG.RNG.from(G.rs);
    const p = makeUnit(runner.id, 0, 0, { side: "p" });
    p.maxHp = runner.hp + (meta.body || 0) * 4;
    p.hp = p.maxHp;
    p.dmg = (runner.dmg || 2) + (meta.fist || 0);
    addSkill(p, runner.skill);                 // 血祭（或该将本技）打底
    if (runner.id === "yinkesi" && (meta.blood || 0) > 0) p.skills[0].blood += meta.blood;
    if (meta.guard) p.st.shield += meta.guard;
    G.player = p;
    enterFloor(G, 0);
    return G;
  }

  /* ---------------- 入层 ---------------- */
  function enterFloor(G, floorIdx) {
    const D = D2();
    const def = D.FLOORS[floorIdx];
    if (!def) throw new Error("no floor " + floorIdx);
    G.floorIdx = floorIdx; G.floorDef = def; G.round = 1; G.campUsed = false;
    G.bestFloor = Math.max(G.bestFloor || 0, floorIdx + 1);
    const built = G4().genFloor(G.seed + "@" + floorIdx, def);
    G.map = built.map;
    const places = built.places;
    const d = D.DIFF_BY_V[G.diff];
    const scaleHp = (v) => Math.max(1, Math.round(v * d.eHp));
    const scaleDmg = (v) => Math.max(1, v + d.eDmg);
    G.enemies = [];
    if (places.boss) {
      const b = makeUnit(def.boss, places.boss[0], places.boss[1], { bossTag: def.bossTag || null, boss: true });
      b.maxHp = scaleHp(b.maxHp); b.hp = b.maxHp; b.dmg = scaleDmg(b.dmg); b.saw += d.saw;
      if (def.bossTag) b.name = def.bossTag + "·" + b.name;
      addSkill(b, D.CH(def.boss).skill);
      (D.CH(def.boss).skills || []).forEach(s => addSkill(b, s));
      b.aggro = false;
      G.enemies.push(b);
    }
    places.elites.forEach(([chId, x, y]) => {
      const e = makeUnit(chId, x, y, { elite: true });
      e.maxHp = scaleHp(e.maxHp); e.hp = e.maxHp; e.dmg = scaleDmg(e.dmg); e.saw += d.saw;
      addSkill(e, D.CH(chId).skill);
      G.enemies.push(e);
    });
    const mobN = def.mobs + (d.eHp >= 2 ? 2 : 0);
    for (let i = 0; i < mobN && i < places.mobs.length; i++) {
      const [x, y] = places.mobs[i];
      const m = makeUnit("mob", x, y, {});
      m.maxHp = scaleHp(m.maxHp); m.hp = m.maxHp; m.dmg = scaleDmg(m.dmg);
      G.enemies.push(m);
    }
    /* 噩梦之外的难档：目力增益已加，树等杂项不动 */
    G.scrollsTotal = places.scrolls.length;
    G.stairsOpen = false;
    G.key = false;
    /* 史官落点：出生宫室正中 */
    G.player.x = G.map.spawn[0]; G.player.y = G.map.spawn[1];
    if ((G.relics || []).includes("shield3")) G.player.st.shield += 3;
    /* 注意：不清 G.ev——下行时 enterFloor 在 act() 中途被调，事件流必须保住 */
    log(G, "入第" + CN_NUM[floorIdx] + "层 · " + def.name);
    if (def.rule) log(G, "〔" + def.rule + "〕" + def.ruleDesc);
    log(G, def.intro);
  }

  const CN_NUM = ["一", "二", "三", "四", "五", "六", "七", "八", "九"];

  /* ---------------- 事件与小工具 ---------------- */
  function ev(G, e) { G.ev.push(e); }
  function log(G, text) { ev(G, { t: "log", text }); }
  function unitAt(G, x, y) {
    if (G.player && !G.player.dead && G.player.x === x && G.player.y === y) return G.player;
    return G.enemies.find(u => !u.dead && u.x === x && u.y === y) || null;
  }
  function occupied(G, x, y) { return !!unitAt(G, x, y); }
  function adj(a, b) { return Math.abs(a.x - b.x) + Math.abs(a.y - b.y) === 1; }
  function hasP(u, key) { return !!(u.passive && u.passive[key]); }
  function livingEnemies(G) { return G.enemies.filter(u => !u.dead && !(u.chId === "tree")); }
  function treeCount(G) {
    let n = 0; const Gr = G3();
    for (let i = 0; i < G.map.tiles.length; i++) if (G.map.tiles[i] === Gr.TREE) n++;
    return n;
  }
  function gateIds(G) {
    const def = G.floorDef;
    return [def.boss].concat(def.gateExtra || []);
  }
  function stairsOpenNow(G) {
    const dead = (chId) => !G.enemies.some(u => u.chId === chId && !u.dead);
    return gateIds(G).every(dead);
  }
  /* 噩梦等难档下的杂兵增量已在入层处理 */

  /* ---------------- 伤害管线 ---------------- */
  /* kind: 'knife' | 'skill' | 'item'；opt: {dmg, push, stun, poison, seal, heal, pierce, noRecur} */
  function strike(G, att, def, kind, opt) {
    opt = opt || {};
    const evs = G.ev;
    /* 闪避 */
    if (!opt.pierce && hasP(def, "dodge") && G.r.chance(def.passive.dodge)) {
      ev(G, { t: "miss", x: def.x, y: def.y, name: def.name });
      log(G, def.name + "闪过一击。");
      return;
    }
    let dmg = opt.dmg || 0;
    /* 情比金坚：相邻之敌，其伤加一 */
    if (G.floorDef.rule === "dyad" && att.side === "e" && kind !== "item") {
      const buddy = livingEnemies(G).some(e => e !== att && !e.dead && G3().manh(e.x, e.y, att.x, att.y) === 1);
      if (buddy) dmg += 1;
    }
    if (kind === "knife") {
      if (hasP(att, "knifeMul")) dmg = (opt.base || dmg) * att.passive.knifeMul;
      /* 急击勿失：对未惊动之敌的先手一刀 +2（在倍率之后施加） */
      if (def.side === "e" && !def.aggro) {
        dmg += 2;
        ev(G, { t: "sneak", x: def.x, y: def.y });
      }
      if (hasP(att, "wallBonus")) {
        const Gr = G3();
        const nearWall = Gr.DIRS.some(([dx, dy]) => Gr.at(G.map, att.x + dx, att.y + dy) === Gr.WALL);
        if (nearWall) dmg += att.passive.wallBonus;
      }
      if (att.side === "p") {
        const R = G.relics || [];
        if (R.includes("firststrike") && !G._firstKnifeUsed) { dmg += 1; G._firstKnifeUsed = true; }
        if (R.includes("nightwalk") && !G._floorKnifeUsed) { dmg += 2; G._floorKnifeUsed = true; }
        if (R.includes("grudge") && att.st.grudge > 0) { dmg += 1; att.st.grudge--; }
        if (att.st.buffKnife > 0) dmg += 1;
      }
      if (hasP(att, "execBonus") && def.hp <= def.maxHp / 2) dmg += att.passive.execBonus;
      if (hasP(att, "lowHpBonus") && att.hp < (att.passive.lowHpAt || 5)) dmg += att.passive.lowHpBonus;
      if (hasP(att, "grudgeStack") && att.st.grudge > 0) { dmg += 1; att.st.grudge--; }
    }
    if (kind === "skill" && opt.evenBonus && def.hp % 2 === 0) dmg += opt.evenBonus;
    /* 血祭之力 */
    if (att.st.emp > 0) { dmg *= 2; att.st.emp--; ev(G, { t: "emp", x: att.x, y: att.y }); }
    /* 暴击（秒之） */
    let crit = false;
    if (hasP(att, "critChance") && G.r.chance(att.passive.critChance)) { dmg = Math.round(dmg * (att.passive.critMul || 2)); crit = true; }
    /* 防方减伤 */
    const pierce = opt.pierce || hasP(att, "pierce");
    if (!pierce) {
      if (def.st.shield > 0) {
        const absorb = Math.min(def.st.shield, dmg);
        def.st.shield -= absorb; dmg -= absorb;
        ev(G, { t: "shield", x: def.x, y: def.y, val: absorb });
      }
      if (dmg > 0 && hasP(def, "takenReduce")) dmg = Math.max(1, dmg - def.passive.takenReduce);
      if (dmg > 0 && hasP(def, "firstHitReduce") && !def.firstHitTaken) { dmg = Math.max(0, dmg - def.passive.firstHitReduce); def.firstHitTaken = true; }
      if (dmg > 0 && hasP(def, "auraReduce") && adj(att, def)) dmg = Math.max(1, dmg - def.passive.auraReduce);
    }
    if (dmg <= 0) { ev(G, { t: "hit", x: def.x, y: def.y, dmg: 0, crit, zero: true }); return; }
    def.hp -= dmg;
    ev(G, { t: "hit", x: def.x, y: def.y, dmg, crit });
    /* 卧薪尝胆（被打者积怨） */
    if (hasP(def, "grudgeStack")) def.st.grudge = Math.min(def.passive.grudgeCap || 2, def.st.grudge + def.passive.grudgeStack);
    /* 附加效果 */
    if (opt.stun && !hasP(def, "immuneStun")) def.st.stun = Math.max(def.st.stun, opt.stun);
    if (opt.seal) def.st.disarm = Math.max(def.st.disarm, opt.seal);
    if (opt.poison) def.st.poison = Math.max(def.st.poison, opt.poison);
    if (opt.heal && !att.dead) heal(G, att, opt.heal);
    if (opt.push && !hasP(def, "immuneKnock") && G.floorDef.rule !== "suomen") {
      const Gr = G3();
      const dx = Math.sign(def.x - att.x), dy = Math.sign(def.y - att.y);
      const [px, py] = Gr.pushDest(G.map, def.x, def.y, dx, dy, opt.push, (x, y) => occupied(G, x, y));
      def.x = px; def.y = py;
    }
    log(G, (att.side === "p" ? "汝击" : "") + (att.side === "e" && def.side === "p" ? "" : "") + hitLine(G, att, def, dmg, kind, crit));
    if (att.side === "e" && def.side === "e") log(G, "〔党争〕" + att.name + "误伤了" + def.name + "！");
    if (def.hp <= 0) kill(G, att, def);
    else uprisingCheck(G);
  }

  function hitLine(G, att, def, dmg, kind, crit) {
    const who = att.side === "p" ? "汝" : att.name;
    const target = def.side === "p" ? "汝" : def.name;
    if (att.side === "p") return "汝以" + (kind === "knife" ? "刀" : "技") + "击" + target + "，伤其" + dmg + (crit ? "（会心！）" : "");
    if (def.side === "p") return att.name + "击汝，汝损" + dmg + "血";
    return att.name + "击" + target + "，伤其" + dmg;
  }

  function heal(G, u, val) {
    if (u.dead) return;
    const before = u.hp;
    u.hp = Math.min(u.maxHp, u.hp + val);
    if (u.hp > before) ev(G, { t: "heal", x: u.x, y: u.y, val: u.hp - before });
  }

  function kill(G, att, def) {
    def.dead = true; def.hp = 0;
    ev(G, { t: "die", x: def.x, y: def.y, glyph: def.glyph, color: def.color, boss: def.boss, chId: def.chId });
    log(G, def.side === "p" ? "汝倒于地下。" : def.name + "败。" + (def.boss ? "镇守已除！" : ""));
    if (def.side === "p") { playerDown(G); return; }
    if (att && att.side === "p") {
      G.kills++;
      /* 击破回血：卷八古法，击破一名敌人回复2血（「庆功之宴」升为4） */
      heal(G, att, G.relics.includes("killheal") ? 4 : 2);
      if (def.boss) {
        G.bossKills.push(def.chId);
        G.wemai += 6;
        bossDrop(G, def);
        log(G, "第" + CN_NUM[G.floorIdx] + "层已定，楼梯开了。");
      } else if (def.elite) {
        G.eliteKills++; G.wemai += 2;
      }
      /* 录技：首次斩有名之角色；图鉴记录 */
      if (!def.mob && !G.learned[def.chId]) {
        G.dexKills = G.dexKills || {};
        G.dexKills[def.chId] = (G.dexKills[def.chId] || 0) + 1;
        const ch = D2().CH(def.chId);
        const sk = ch.skill || (ch.skills || [])[0];
        if (sk && sk.kind !== "summon") {
          G.learned[def.chId] = true;
          if (!G.learnedSkills.includes(sk.id)) {
            G.learnedSkills.push(sk.id);
            addSkill(G.player, sk);
            ev(G, { t: "learn", name: sk.name, chId: def.chId });
            log(G, "录技：「" + sk.name + "」入谱。");
          }
        }
        ev(G, { t: "dex", chId: def.chId });
      }
    }
    uprisingCheck(G);
  }

  function bossDrop(G, def) {
    const R = D2().RELICS;
    const pool = Object.keys(R).filter(id => !G.relics.includes(id));
    if (pool.length) {
      const id = G.r.pick(pool);
      G.relics.push(id);
      ev(G, { t: "relic", id, name: R[id].name });
      log(G, "得刀卡「" + R[id].name + "」——" + R[id].desc);
    }
    G.money += 15 + G.r.int(0, 10);
  }

  function playerDown(G) {
    const p = G.player;
    if (hasP(p, "lethalKeep") && !p.lethalUsed) {
      p.lethalUsed = true; p.hp = 1;
      ev(G, { t: "lethalkeep", x: p.x, y: p.y });
      log(G, "皇太子之命硬——留了1血。");
      return;
    }
    G.over = true; G.won = false;
    ev(G, { t: "dead" });
    log(G, "笔滞于此，且搁笔——此轮所想，皆成文脉。");
  }

  /* ---------------- 起义特则：琛半血召心腹 ---------------- */
  function uprisingCheck(G) {
    if (G.floorDef.rule !== "uprising" || G._uprisingDone) return;
    const boss = G.enemies.find(u => u.boss && !u.dead);
    if (boss && boss.hp <= boss.maxHp / 2) {
      G._uprisingDone = true;
      log(G, "琛夺话筒曰：凡有责任，在吾一人！——其二心腹入场。");
      let placed = 0;
      for (let r = 2; r <= 4 && placed < 2; r++) {
        for (let dy = -r; dy <= r && placed < 2; dy++) for (let dx = -r; dx <= r && placed < 2; dx++) {
          if (Math.abs(dx) + Math.abs(dy) !== r) continue;
          const x = boss.x + dx, y = boss.y + dy;
          const Gr = G3();
          if (Gr.inB(G.map, x, y) && Gr.walkable(G.map, x, y) && !occupied(G, x, y)) {
            const d = D2().DIFF_BY_V[G.diff];
            const m = makeUnit("mob", x, y, {});
            m.maxHp = Math.max(1, Math.round(m.maxHp * d.eHp)); m.hp = m.maxHp; m.dmg = Math.max(1, m.dmg + d.eDmg);
            m.aggro = true; G.enemies.push(m);
            ev(G, { t: "summon", x, y, chId: "mob" });
            placed++;
          }
        }
      }
    }
  }

  /* ---------------- 回合开始（特则） ---------------- */
  function roundStart(G) {
    G._firstKnifeUsed = false;
    G.enemies.forEach(u => { u.firstHitTaken = false; });
    const p = G.player;
    if (G.floorDef.rule === "cans" && !p.dead) {
      const lined = livingEnemies(G).some(e => e.x === p.x || e.y === p.y);
      if (lined) {
        p.hp -= 1;
        ev(G, { t: "bottle", x: p.x, y: p.y, dmg: 1 });
        log(G, "看台飞瓶坠下，砸汝1血——莫与敌同行同列。");
        if (p.hp <= 0) playerDown(G);
      }
    }
    if (G.floorDef.rule === "zhongshu") {
      if (treeCount(G) < 3) {
        for (let t = 0; t < 30; t++) {
          const x = G.r.int(1, G.map.w - 2), y = G.r.int(1, G.map.h - 2);
          const Gr = G3();
          if (Gr.at(G.map, x, y) === Gr.FLOOR && !occupied(G, x, y) &&
              (Math.abs(x - p.x) + Math.abs(y - p.y)) >= 3) {
            Gr.set(G.map, x, y, Gr.TREE);
            ev(G, { t: "tree", x, y });
            log(G, "崇国又种一树。（多种树木，树木皆死）");
            break;
          }
        }
      }
    }
  }

  /* ---------------- 敌人回合 ---------------- */
  function enemiesAct(G) {
    const p = G.player;
    for (const u of G.enemies) {
      if (u.dead || u.side !== "e" || u.chId === "tree") continue;
      if (G.over) break;
      /* 晕眩 */
      if (u.st.stun > 0) { u.st.stun--; ev(G, { t: "stunned", uid: u.uid }); continue; }
      const Gr = G3();
      const dMan = Gr.manh(u.x, u.y, p.x, p.y);
      /* 惊动 */
      if (!u.aggro) {
        if (u.saw > 0 && dMan <= u.saw && Gr.los(G.map, u.x, u.y, p.x, p.y)) {
          u.aggro = true; u.loseT = 0;
          ev(G, { t: "alert", x: u.x, y: u.y, name: u.name, boss: u.boss });
          if (u.boss) log(G, u.name + "（镇守）惊起：" + bossTaunt(G, u.chId));
        } else if (u.mob && G.r.chance(0.3)) {
          const [dx, dy] = G.r.pick(Gr.DIRS);
          const nx = u.x + dx, ny = u.y + dy;
          if (Gr.walkable(G.map, nx, ny) && !occupied(G, nx, ny) && !isSpecialTile(G, nx, ny)) { u.x = nx; u.y = ny; }
        }
      } else if (!u.boss) {
        /* 脱离仇恨：久失其踪、或久追而不曾近身，则弃追（镇守不弃——惊起必寻至） */
        const seen = dMan <= u.saw + 4 && Gr.los(G.map, u.x, u.y, p.x, p.y);
        if (adj(u, p)) u.lastClose = G.round;
        if (seen && (G.round - (u.lastClose || 0)) < 12) u.loseT = 0;
        else {
          u.loseT = (u.loseT || 0) + 1;
          if (u.loseT >= 6) { u.aggro = false; u.loseT = 0; ev(G, { t: "lost", uid: u.uid }); }
        }
      }
      if (!u.aggro || p.dead) continue;
      /* 党争：二成机率误伤身边随机一人（含同门）——贴身混战时才可能打错 */
      let victim = p;
      if (G.floorDef.rule === "chaos" && adj(u, p) && G.r.chance(0.2)) {
        const cands = [p].concat(G.enemies).filter(o => o !== u && !o.dead && adj(u, o));
        if (cands.length) victim = G.r.pick(cands);
      }
      /* 用技（cd 好了且有合适目标，Boss 更积极） */
      if (u.st.disarm === 0 && u.skills.length && G.r.chance(u.boss ? 0.65 : 0.45)) {
        const sk = u.skills.find(s => s.cdLeft === 0 && aiSkillTarget(G, u, s));
        if (sk) { aiUseSkill(G, u, sk, aiSkillTarget(G, u, sk)); continue; }
      }
      /* 邻接则刀击 */
      if (adj(u, p)) {
        strike(G, u, victim, "knife", { dmg: u.dmg });
        continue;
      }
      /* 否则趋近（一步或两步） */
      let steps = u.moveRange || 1;
      while (steps-- > 0 && !adj(u, p) && !p.dead) {
        const blocked = (x, y) => occupied(G, x, y) || isSpecialTile(G, x, y);
        const nxt = Gr.stepToward(G.map, u.x, u.y, p.x, p.y, blocked);
        if (!nxt) break;
        ev(G, { t: "emove", uid: u.uid, x0: u.x, y0: u.y, x1: nxt[0], y1: nxt[1] });
        u.x = nxt[0]; u.y = nxt[1];
      }
      if (adj(u, p)) strike(G, u, p, "knife", { dmg: u.dmg });
    }
  }
  function isSpecialTile(G, x, y) {
    /* 史料与楼梯格可通行（玩家走过拾/踏上另行交互）；箱/灶/商摊对敌是障碍 */
    const Gr = G3(); const t = Gr.at(G.map, x, y);
    return t === Gr.CHEST || t === Gr.SHOP || t === Gr.CAMPFIRE;
  }
  function bossTaunt(G, chId) {
    const pool = {
      wanzhen: ["来。", "题？给我。", "刀者，如解方程。"],
      dage: ["来呀来呀。", "此不类高考乎？"],
      luhao: ["来呀来呀，重开重开。", "规矩是：活者为王。"],
      zichen: ["此为通知尔，非求建议也。", "号令两班，政由琛出。"],
      touge: ["三溴化氮。", "莫贴吾身。"],
      qinfa: ["此何课也？", "汝手拿出来。"],
      wonder: ["GBC，算不算。", "来呀来呀。"],
      chongguo: ["为师者，吾之属地也。", "此局未终。"]
    };
    const arr = pool[chId] || ["来呀来呀。"];
    return arr[Math.floor(G.r.next() * arr.length)];
  }
  /* AI 技能目标搜索：返回目标坐标或 null */
  function aiSkillTarget(G, u, sk) {
    const p = G.player;
    if (p.dead) return null;
    if (sk.kind === "global") return [p.x, p.y];
    if (sk.kind === "blink") return [p.x, p.y];
    if (sk.kind === "burst" || sk.kind === "unit") {
      if (sk.kind === "burst" && sk.range === 1) return adj(u, p) ? [p.x, p.y] : null;
      const d = G3().manh(u.x, u.y, p.x, p.y);
      if (d <= (sk.range || 1)) return [p.x, p.y];
      return null;
    }
    if (sk.kind === "self") return (sk.heal && u.hp < u.maxHp) ? [u.x, u.y] : null;
    return null;
  }
  function aiUseSkill(G, u, sk, target) {
    sk.cdLeft = sk.cd + (hasP(u, "cdCut") ? -1 : 0);
    const p = G.player;
    if (sk.kind === "global") {
      ev(G, { t: "skill", name: sk.name, who: u.name });
      log(G, u.name + "使出「" + sk.name + "」。");
      if (sk.dmg) strike(G, u, p, "skill", { dmg: sk.dmg, stun: sk.stun });
      else if (sk.seal) { p.st.disarm = Math.max(p.st.disarm, sk.seal); log(G, "汝之技被封一回合。（" + sk.name + "）"); }
    } else if (sk.kind === "blink") {
      /* 闪现贴脸 */
      const spot = G3().DIRS.map(([dx, dy]) => [p.x + dx, p.y + dy])
        .find(([x, y]) => G3().inB(G.map, x, y) && G3().walkable(G.map, x, y) && !occupied(G, x, y));
      if (spot) {
        ev(G, { t: "emove", uid: u.uid, x0: u.x, y0: u.y, x1: spot[0], y1: spot[1], blink: true });
        u.x = spot[0]; u.y = spot[1];
      }
      ev(G, { t: "skill", name: sk.name, who: u.name });
      strike(G, u, p, "skill", { dmg: sk.dmg, seal: sk.seal, pierce: true });
    } else if (sk.kind === "burst") {
      ev(G, { t: "skill", name: sk.name, who: u.name });
      log(G, u.name + "使出「" + sk.name + "」。");
      if (G3().manh(u.x, u.y, p.x, p.y) <= sk.range) {
        const opt = { dmg: sk.dmg, poison: sk.poison };
        if (sk.stunChance !== undefined) { if (G.r.chance(sk.stunChance)) opt.stun = sk.stun; } else opt.stun = sk.stun;
        strike(G, u, p, "skill", opt);
      }
    } else if (sk.kind === "unit") {
      ev(G, { t: "skill", name: sk.name, who: u.name });
      log(G, u.name + "使出「" + sk.name + "」。");
      strike(G, u, p, "skill", { dmg: sk.dmg, stun: sk.stun, seal: sk.seal, evenBonus: sk.evenBonus });
    } else if (sk.kind === "self") {
      if (sk.heal) { heal(G, u, sk.heal); log(G, u.name + "回复" + sk.heal + "血。（" + sk.name + "）"); }
    }
  }

  /* ---------------- 回合结束（状态与特则） ---------------- */
  function turnEnd(G) {
    const p = G.player;
    /* 毒 */
    [p].concat(G.enemies).forEach(u => {
      if (u.dead || !u.st.poison) return;
      u.hp -= 1; u.st.poison--;
      ev(G, { t: "poison", x: u.x, y: u.y });
      log(G, (u.side === "p" ? "汝" : u.name) + "中鸩毒，损1血。");
      if (u.hp <= 0) kill(G, null, u);
    });
    if (G.over) return;
    /* 鲍鱼之肆（层特则）与神人臭气（被动）同源处理 */
    const auraUnits = [];
    if (G.floorDef.rule === "stench") auraUnits.push(p);
    G.enemies.forEach(u => { if (!u.dead && hasP(u, "poisonAura")) auraUnits.push(u); });
    auraUnits.forEach(src => {
      const targets = src.side === "p" ? livingEnemies(G) : (p.dead ? [] : [p]);
      targets.forEach(t => {
        if (G3().manh(src.x, src.y, t.x, t.y) === 1) {
          t.hp -= 1;
          ev(G, { t: "hit", x: t.x, y: t.y, dmg: 1, aura: true });
          log(G, "〔鲍鱼之肆〕" + (t.side === "p" ? "汝" : t.name) + "被蚀1血。");
          if (t.hp <= 0) kill(G, src, t);
        }
      });
    });
    if (G.over) return;
    /* 验算 */
    if (G.floorDef.rule === "yansuan") {
      const w = G.enemies.find(u => u.chId === "wonder" && !u.dead);
      if (w && w.hp % 2 === 0 && w.hp < w.maxHp) { heal(G, w, 2); log(G, "〔验算〕wonder血量为偶，回2血。"); }
    }
    /* 神人等被动每回合自愈类：无 */
    /* 冷却与计时 */
    [p].concat(G.enemies).forEach(u => {
      u.skills.forEach(s => { if (s.cdLeft > 0) s.cdLeft--; });
      if (u.st.disarm > 0) u.st.disarm--;
      if (u.st.buffKnife > 0) u.st.buffKnife--;
    });
  }

  /* ---------------- 玩家动作 ---------------- */
  /* action: {t:'move',dx,dy} | {t:'skill',si,tx,ty} | {t:'item',ii,tx,ty} | {t:'wait'} */
  function act(G, action) {
    if (G.over) return G.ev = [], [];
    G.ev = [];
    const evs = G.ev;
    roundStart(G);
    if (!G.over) {
      const p = G.player;
      if (action.t === "move") doMove(G, p, action.dx, action.dy);
      else if (action.t === "skill") doSkill(G, p, action.si, action.tx, action.ty);
      else if (action.t === "item") doItem(G, p, action.ii, action.tx, action.ty);
      else if (action.t === "wait") { log(G, "汝按刀不动。（待机）"); }
      /* 兜底 */
    }
    if (!G.over && !G.won) enemiesAct(G);
    if (!G.over) turnEnd(G);
    /* 楼梯开了没有（镇守死绝） */
    const open = stairsOpenNow(G);
    if (open && !G.stairsOpen) {
      G.stairsOpen = true;
      if (G.floorDef.gateExtra && !G.key) { /* 锁门层另行 */ }
      ev(G, { t: "stairsOpen" });
    }
    if (!G.over && stairsOpenNow(G) && G.floorDef.rule === "suomen") G.key = true;
    G.round++;
    return evs.slice();
  }

  function doMove(G, p, dx, dy) {
    const Gr = G3();
    const nx = p.x + dx, ny = p.y + dy;
    if (!Gr.inB(G.map, nx, ny)) return;
    const foe = unitAt(G, nx, ny);
    if (foe && foe.side === "e") {
      /* 撞击即刀击（长杆马刀让玩家可以隔一格刺） */
      strike(G, p, foe, "knife", { base: p.dmg, dmg: p.dmg });
      return;
    }
    if (foe && foe.side === "p") return;
    const t = Gr.at(G.map, nx, ny);
    if (t === Gr.WALL) return;
    if (t === Gr.TREE) { /* 树可击碎 */
      const tree = unitAt(G, nx, ny) || { chId: "tree" };
      Gr.set(G.map, nx, ny, Gr.FLOOR);
      ev(G, { t: "treebreak", x: nx, y: ny });
      log(G, "汝碎一树。（树木皆死）");
      return;
    }
    if (t === Gr.CHEST) return openChest(G, nx, ny);
    if (t === Gr.CAMPFIRE) return doCamp(G, nx, ny);
    if (t === Gr.SHOP) { ev(G, { t: "shop", x: nx, y: ny }); return; }
    if (t === Gr.STAIRS) return tryDescend(G);
    /* 正常走：moveRange 步（李默/大展类被动） */
    let steps = p.moveRange || 1;
    let cx = p.x, cy = p.y;
    ev(G, { t: "move", uid: p.uid, x0: p.x, y0: p.y });
    while (steps-- > 0) {
      const tx = cx + dx, ty = cy + dy;
      if (!Gr.inB(G.map, tx, ty)) break;
      if (occupied(G, tx, ty)) break;
      const tt = Gr.at(G.map, tx, ty);
      if (tt === Gr.WALL || tt === Gr.TREE || tt === Gr.CHEST || tt === Gr.CAMPFIRE || tt === Gr.SHOP) break;
      cx = tx; cy = ty;
      if (tt === Gr.SCROLL) { pickScroll(G, cx, cy); break; }
      if (tt === Gr.STAIRS) break; // 走上梯格即视为「在梯上」，交互另行
    }
    p.x = cx; p.y = cy;
    ev(G, { t: "move", uid: p.uid, x1: p.x, y1: p.y });
  }

  function pickScroll(G, x, y) {
    const Gr = G3();
    const id = "f" + G.floorIdx + "@" + x + "," + y;
    Gr.set(G.map, x, y, Gr.FLOOR);
    G.scrollsGot.push(id);
    G.wemai += 1;
    ev(G, { t: "scroll", x, y, id });
    log(G, "拾史料一枚。（文脉+1）");
    if (G.scrollsGot.filter(s => s.startsWith("f" + G.floorIdx + "@")).length >= G.scrollsTotal && G.scrollsTotal > 0) {
      G.wemai += 3;
      log(G, "本层史料集齐——赏文脉3。");
    }
  }

  function openChest(G, x, y) {
    const Gr = G3();
    Gr.set(G.map, x, y, Gr.FLOOR);
    const roll = G.r.next();
    if (roll < 0.42) {
      const m = 8 + G.r.int(0, 8);
      G.money += m;
      ev(G, { t: "chest", what: "money", val: m, x, y });
      log(G, "开箱得零花钱" + m + "。");
    } else if (roll < 0.75) {
      const D = D2();
      const id = G.r.pick(["fantuan", "mantou", "hugoushuang", "yumi", "shuihu", "heibang"]);
      addItem(G, id);
      ev(G, { t: "chest", what: "item", id, x, y });
      log(G, "开箱得「" + D.ITEMS[id].name + "」。");
    } else {
      const R = D2().RELICS;
      const pool = Object.keys(R).filter(id => !G.relics.includes(id));
      if (pool.length) {
        const id = G.r.pick(pool);
        G.relics.push(id);
        ev(G, { t: "chest", what: "relic", id, x, y });
        log(G, "开箱得刀卡「" + R[id].name + "」。");
      } else {
        const m = 10 + G.r.int(0, 6);
        G.money += m;
        ev(G, { t: "chest", what: "money", val: m, x, y });
        log(G, "开箱得零花钱" + m + "。（刀卡已集齐）");
      }
    }
  }

  function addItem(G, id) {
    const slot = G.items.find(i => i.id === id);
    if (slot) slot.n++;
    else G.items.push({ id, n: 1 });
  }

  function doCamp(G, x, y) {
    if (G.campUsed) { log(G, "灶间已冷。"); return; }
    G.campUsed = true;
    const p = G.player;
    p.hp = p.maxHp;
    p.skills.forEach(s => s.cdLeft = 0);
    const meta = G._metaBonuses || {};
    if (meta.hearth) p.st.shield += 3;
    G3().set(G.map, x, y, G3().FLOOR);
    ev(G, { t: "camp", x, y });
    log(G, "灶间歇息——血满，技冷尽清。" + (meta.hearth ? "（灶膛余温，护盾+3）" : ""));
  }

  function tryDescend(G) {
    if (!stairsOpenNow(G)) {
      const left = gateIds(G).filter(id => G.enemies.some(u => u.chId === id && !u.dead)).map(id => D2().CH(id).name);
      ev(G, { t: "stairsLocked" });
      log(G, "梯封未开——尚有镇守：" + left.join("、"));
      return;
    }
    if (G.floorIdx >= D2().FLOORS.length - 1) {
      /* 第九层斩毕 → 收卷 */
      G.over = true; G.won = true;
      ev(G, { t: "win" });
      log(G, "梦将醒。最后一卷落笔——刀史收卷。");
      return;
    }
    G.wemai += 3;
    G.firstClears.push(G.floorIdx); // 记录（首次赏由 run 层判重）
    ev(G, { t: "descend" });
    enterFloor(G, G.floorIdx + 1);
    /* 下行喘息：回25%血 */
    const p = G.player;
    heal(G, p, Math.max(2, Math.round(p.maxHp * 0.25)));
    if (G.relics.includes("shield3")) p.st.shield += 3;
  }

  /* ---------------- 用技 ---------------- */
  function skillTargetOk(G, p, sk, tx, ty) {
    const Gr = G3();
    if (sk.kind === "self") return true;
    if (sk.kind === "global") return true;
    if (tx == null || ty == null) return false;
    if (!Gr.inB(G.map, tx, ty)) return false;
    const d = Gr.manh(p.x, p.y, tx, ty);
    if (d > (sk.range || 1)) return false;
    const foe = unitAt(G, tx, ty);
    return !!(foe && foe.side === "e" && !foe.dead);
  }

  function doSkill(G, p, si, tx, ty) {
    if (p.st.disarm > 0) { log(G, "汝之技被封（当场抓获）——" + p.st.disarm + "回合后方可再用。"); return; }
    const sk = p.skills[si];
    if (!sk) return;
    if (sk.cdLeft > 0) { log(G, "「" + sk.name + "」尚在冷却（" + sk.cdLeft + "）。"); return; }
    if (!skillTargetOk(G, p, sk, tx, ty)) { log(G, "此处不可施「" + sk.name + "」。"); return; }
    sk.cdLeft = sk.cd;
    const foe = tx != null ? unitAt(G, tx, ty) : null;
    ev(G, { t: "skill", name: sk.name, who: "汝" });
    if (sk.id === "xueji") { /* 血祭：至多损半、至少留1；「以道代血」免损 */
      let pay = 0;
      if (!G.relics.includes("bloodfree")) { pay = Math.min(Math.floor(p.hp / 2), p.hp - 1); p.hp -= pay; }
      p.st.emp += (sk.blood || 2);
      ev(G, { t: "blood", x: p.x, y: p.y, pay, charges: p.st.emp });
      log(G, "血祭！" + (pay ? "损" + pay + "血，" : "") + "接下来" + p.st.emp + "次伤害翻倍。");
      return;
    }
    if (sk.kind === "self") {
      if (sk.heal) { heal(G, p, sk.heal); log(G, "汝使「" + sk.name + "」，回" + sk.heal + "血。"); }
      if (sk.apGain) { /* 提壶狂奔：清技冷+聚力 */
        p.skills.forEach(s => { if (s.id !== sk.id) s.cdLeft = 0; });
        p.st.emp += (sk.empower || 1);
        log(G, "汝提壶狂奔，技冷尽清，下次伤害+1。");
      }
      return;
    }
    if (sk.kind === "global") {
      log(G, "汝使「" + sk.name + "」——全场波动！");
      livingEnemies(G).forEach(e => strike(G, p, e, "skill", { dmg: sk.dmg, stun: sk.stun }));
      return;
    }
    if (sk.kind === "burst") {
      log(G, "汝使「" + sk.name + "」。");
      const r = sk.range || 1;
      livingEnemies(G).filter(e => G3().manh(p.x, p.y, e.x, e.y) <= r).forEach(e => {
        const opt = { dmg: sk.dmg, poison: sk.poison };
        if (sk.stunChance !== undefined) { if (G.r.chance(sk.stunChance)) opt.stun = sk.stun; } else opt.stun = sk.stun;
        strike(G, p, e, "skill", opt);
      });
      return;
    }
    /* unit 单体 */
    const opt = { dmg: sk.dmg || 0, push: sk.push, stun: sk.stun, seal: sk.seal, evenBonus: sk.evenBonus };
    strike(G, p, foe, "skill", opt);
    /* 技能伤害显示基准：knifeMul 不适用技能 */
  }

  /* ---------------- 用物 ---------------- */
  function doItem(G, p, ii, tx, ty) {
    const it = G.items[ii];
    if (!it || it.n <= 0) return;
    const D = D2();
    const def = D.ITEMS[it.id];
    const consume = () => { it.n--; if (it.n <= 0) G.items.splice(ii, 1); };
    if (def.kind === "heal") { heal(G, p, def.val + (G._metaBonuses && G._metaBonuses.appetite ? G._metaBonuses.appetite * 2 : 0)); log(G, "汝食「" + def.name + "」。"); consume(); }
    else if (def.kind === "shield") { p.st.shield += def.val; log(G, "汝抹「" + def.name + "」，护盾+" + def.val + "。"); consume(); }
    else if (def.kind === "empower") { p.st.emp += 1; log(G, "汝持「" + def.name + "」为刃——下次伤害翻倍。"); consume(); }
    else if (def.kind === "cdclear") { p.skills.forEach(s => s.cdLeft = 0); log(G, "汝举壶痛饮，技冷尽清。"); consume(); }
    else if (def.kind === "buff") { p.st.buffKnife = def.val; log(G, "汝执黑棒——" + def.val + "回合刀击+1。"); consume(); }
    else if (def.kind === "throw") {
      const foe = tx != null ? unitAt(G, tx, ty) : null;

<script>

<script>
/* ============================================================

 * ============================================================ */
(function () {

    seen.forEach(([x, y]) => { G.explored[x + "," + y] = 1; });

        case "shield": addFloat(G, e.x, e.y, "盾-" + e.val, "#c9a45f"); break;
        case "blood": addFloat(G, e.x, e.y, "血祭！", "#c14b3a"); S.hit(); break;

        case "tree": S.eat(); break;
