      const k = 1 - (now - f.t0) / 180;
      ctx.fillStyle = "rgba(255,240,210," + k * .5 + ")";
      ctx.fillRect(f.x * TILE, f.y * TILE, TILE, TILE);
    });
    /* 浮字 */
    floats = floats.filter(f => now - f.t0 < 900);
    floats.forEach(f => {
      const k = (now - f.t0) / 900;
      ctx.globalAlpha = 1 - k;
      ctx.fillStyle = f.color;
      ctx.font = "bold 16px serif";
      ctx.textAlign = "center";
      ctx.fillText(f.text, f.x * TILE + TILE / 2, f.y * TILE + TILE * .35 - k * 26);
      ctx.globalAlpha = 1;
    });
    ctx.textAlign = "left";
    drawMinimap(G);
  }

  function drawTile(G, x, y, t, vis) {
    const Gr = GRID();
    const px = x * TILE, py = y * TILE;
    if (t === Gr.WALL) {
      ctx.fillStyle = vis ? "#141c2f" : "#101627";
      ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = "rgba(0,0,0,.25)";
      ctx.fillRect(px, py + TILE - 5, TILE, 5);
      ctx.strokeStyle = "rgba(29,41,65,.6)";
      ctx.strokeRect(px + .5, py + .5, TILE - 1, TILE - 1);
      return;
    }
    /* 地面 */
    ctx.fillStyle = t === Gr.CORR ? "#0d1424" : "#111a2e";
    ctx.fillRect(px, py, TILE, TILE);
    ctx.strokeStyle = "rgba(29,41,65,.35)";
    ctx.strokeRect(px + .5, py + .5, TILE - 1, TILE - 1);
    if (t === Gr.STAIRS) {
      const open = ENG().stairsOpenNow(G);
      ctx.fillStyle = open ? "rgba(201,164,95,.2)" : "rgba(125,138,165,.08)";
      ctx.fillRect(px + 4, py + 4, TILE - 8, TILE - 8);
      ctx.fillStyle = open ? "#ecd39a" : "#4a5570";
      ctx.font = "20px serif"; ctx.textAlign = "center";
      ctx.fillText(open ? "梯" : "锁", px + TILE / 2, py + TILE / 2 + 7);
      ctx.textAlign = "left";
    } else if (t === Gr.CHEST) {
      ctx.fillStyle = "#6a4f2c"; ctx.fillRect(px + 7, py + 12, TILE - 14, TILE - 22);
      ctx.fillStyle = "#c9a45f"; ctx.fillRect(px + 7, py + 12, TILE - 14, 5);
      ctx.fillStyle = "#2c2014"; ctx.fillRect(px + TILE / 2 - 2, py + 19, 4, 7);
    } else if (t === Gr.SCROLL) {
      ctx.fillStyle = "#d8cba8"; ctx.fillRect(px + 12, py + 10, TILE - 24, TILE - 20);
      ctx.fillStyle = "#8a3b3b"; ctx.fillRect(px + 12, py + 10, 4, TILE - 20);
      ctx.fillStyle = "#5a4a2c"; ctx.font = "12px serif"; ctx.textAlign = "center";
      ctx.fillText("史", px + TILE / 2 + 2, py + TILE / 2 + 4);
      ctx.textAlign = "left";
    } else if (t === Gr.CAMPFIRE) {
      ctx.fillStyle = "#3a2c1c"; ctx.fillRect(px + 8, py + TILE - 14, TILE - 16, 6);
      const f = 3 + Math.sin(performance.now() / 160 + x) * 1.5;
      ctx.fillStyle = "rgba(230,140,60,.9)";
      ctx.beginPath(); ctx.arc(px + TILE / 2, py + TILE - 18, 5 + f, 0, 7); ctx.fill();
      ctx.fillStyle = "rgba(236,211,154,.9)";
      ctx.beginPath(); ctx.arc(px + TILE / 2, py + TILE - 19, 2.5 + f * .5, 0, 7); ctx.fill();
    } else if (t === Gr.SHOP) {
      ctx.fillStyle = "#26402f"; ctx.fillRect(px + 5, py + 10, TILE - 10, TILE - 18);
      ctx.fillStyle = "#c9a45f"; ctx.font = "16px serif"; ctx.textAlign = "center";
      ctx.fillText("贾", px + TILE / 2, py + TILE / 2 + 5);
      ctx.textAlign = "left";
    }
  }

  function drawUnit(u, now, isPlayer) {
    const px = u.x * TILE, py = u.y * TILE;
    const bob = Math.sin(now / 300 + u.x * 3) * 1.2;
    /* 影 */
    ctx.fillStyle = "rgba(0,0,0,.4)";
    ctx.beginPath(); ctx.ellipse(px + TILE / 2, py + TILE - 6, 13, 5, 0, 0, 7); ctx.fill();
    /* 体 */
    const r = 14;
    ctx.fillStyle = u.color;
    ctx.strokeStyle = isPlayer ? "#ecd39a" : (u.boss ? "#c14b3a" : "rgba(0,0,0,.4)");
    ctx.lineWidth = isPlayer ? 2.5 : (u.boss ? 2.5 : 1.5);
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(px + TILE / 2 - r, py + 6 + bob, r * 2, r * 2, 7);
    else ctx.rect(px + TILE / 2 - r, py + 6 + bob, r * 2, r * 2);
    ctx.fill(); ctx.stroke();
    /* 字牌 */
    ctx.fillStyle = "#fff";
    ctx.font = "bold 17px serif"; ctx.textAlign = "center";
    ctx.fillText(u.glyph, px + TILE / 2, py + 6 + bob + 23);
    ctx.textAlign = "left";
    /* 血条 */
    const w = TILE - 12, hpr = Math.max(0, u.hp / u.maxHp);
    ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(px + 6, py + TILE - 3, w, 3);
    ctx.fillStyle = hpr > .5 ? "#7dc99a" : (hpr > .25 ? "#d0a04f" : "#c14b3a");
    ctx.fillRect(px + 6, py + TILE - 3, w * hpr, 3);
    /* 状态角标 */
    let ix = 0;
    const mark = (txt, color) => { ctx.fillStyle = color; ctx.font = "10px serif"; ctx.fillText(txt, px + 4 + ix * 11, py + 12); ix++; };
    if (u.st.shield > 0) mark("盾", "#c9a45f");
    if (u.st.poison > 0) mark("毒", "#8aa04f");
    if (u.st.stun > 0) mark("晕", "#9aa7c4");
    if (u.st.disarm > 0) mark("缴", "#d0705f");
    if (u.st.emp > 0) mark("祭", "#c14b3a");
    if (isPlayer && u.st.buffKnife > 0) mark("棒", "#d0a04f");
  }

  function drawMinimap(G) {
    if (!mctx) return;
    const Gr = GRID();
    const s = Math.min(mm.width / G.map.w, mm.height / G.map.h);
    mctx.fillStyle = "rgba(7,11,20,1)"; mctx.fillRect(0, 0, mm.width, mm.height);
    for (let y = 0; y < G.map.h; y++) for (let x = 0; x < G.map.w; x++) {
      if (!G.explored || !G.explored[x + "," + y]) continue;
      const t = Gr.at(G.map, x, y);
      mctx.fillStyle = t === Gr.WALL ? "#141c2f" : "#232f4d";
      mctx.fillRect(x * s, y * s, s, s);
      if (t === Gr.STAIRS) { mctx.fillStyle = "#c9a45f"; mctx.fillRect(x * s, y * s, s, s); }
      if (t === Gr.CAMPFIRE) { mctx.fillStyle = "#d08a4f"; mctx.fillRect(x * s, y * s, s, s); }
    }
    mctx.fillStyle = "#ecd39a";
    mctx.fillRect(G.player.x * s - 1, G.player.y * s - 1, s + 2, s + 2);
  }

  MDG.UI = { init, draw, playEvents, updateFov, addFloat, kick, showFloorCard, getCam: () => cam, armed: { get: () => armedSkill, set: (v) => { armedSkill = v; targetInfo = v >= 0 ? {} : null; } } };
})();

</script>
<script>
/* ============================================================
 * 实验史记 · 马刀地宫 —— 窗牖卷（HUD 与诸面板）
 * 顶栏 / 技能栏 / 史官记事 / 行囊 / 刀谱 / 图鉴 / 修炼 / 名册 /
 * 商摊 / 设置 / 帮助 / 终局结算。挂载：MDG.HUD
 * ============================================================ */
(function () {
  "use strict";
  const MDG = window.MDG;
  const { $, el, toast } = MDG.APP;

  let game = null; // 由 main.js 注入 {G, meta, onAct, onShopBuy...}

  function bind(g) { game = g; }

  /* ---------------- 顶栏 ---------------- */
  function refreshHUD() {
    const G = game.G, M = game.meta;
    const def = G.floorDef;
    $("hud-floor-num").textContent = "第" + ["一", "二", "三", "四", "五", "六", "七", "八", "九"][G.floorIdx] + "层 ·";
    $("hud-floor-name").textContent = def.name + (G.player.bossTag ? "" : "");
    const rule = $("hud-rule");
    rule.textContent = def.rule ? "〔" + def.rule + "〕" : "";
    rule.title = def.ruleDesc || "";
    rule.style.display = def.rule ? "" : "none";
    $("bar-hp").style.width = Math.max(0, G.player.hp / G.player.maxHp * 100) + "%";
    $("bar-hp-text").textContent = Math.max(0, G.player.hp) + " / " + G.player.maxHp;
    $("bar-emp").style.width = (G.player.st.emp > 0 ? Math.min(100, G.player.st.emp * 50) : 0) + "%";
    $("bar-shield").textContent = (G.player.st.shield > 0 ? "盾 " + G.player.st.shield : "") + (G.player.st.buffKnife > 0 ? "　黑棒 " + G.player.st.buffKnife : "") + (G.player.lethalUsed ? "　命硬已用" : "");
    $("hud-cash").textContent = G.money;
    $("hud-wemai").textContent = G.wemai;
    $("hud-kills").textContent = "斩 " + G.kills;
  }

  /* ---------------- 技能栏 ---------------- */
  function refreshSkillbar() {
    const G = game.G;
    const bar = $("skillbar");
    bar.innerHTML = "";
    G.player.skills.forEach((sk, i) => {
      const d = el("div", "skill" + (MDG.UI.armed.get() === i ? " armed" : ""));
      d.innerHTML = `<span class="key">${i + 1}</span><b>${sk.name}</b><i>${sk.kind === "self" ? "自身" : sk.kind === "global" ? "全场" : "距" + (sk.range || 1)}</i>`;
      if (sk.cdLeft > 0) {
        const cd = el("div", "cd", String(sk.cdLeft));
        d.appendChild(cd);
      }
      d.onclick = () => window.MDG.Input.onSkillKey(i);
      bar.appendChild(d);
    });
    const wait = el("div", "skill");
    wait.innerHTML = `<span class="key">空格</span><b>待机</b><i>回合一</i>`;
    wait.onclick = () => MDG.Input.act({ t: "wait" });
    bar.appendChild(wait);
  }

  /* ---------------- 史官记事 ---------------- */
  function pushLog(evs) {
    const box = $("log");
    if (!box) return;
    evs.forEach(e => {
      if (e.t !== "log") return;
      const ln = el("div", "ln", e.text);
      if (e.text.includes("镇守") || e.text.includes("录技") || e.text.includes("刀卡") || e.text.includes("灶间")) ln.classList.add("hot");
      if (e.text.includes("汝损") || e.text.includes("折于") || e.text.includes("蚀")) ln.classList.add("bad");
      box.appendChild(ln);
      while (box.children.length > 9) box.firstChild.remove();
    });
  }

  /* ---------------- 通用面板 ---------------- */
  function openPanel(title, render) {
    $("panel-title").textContent = title;
    const body = $("panel-body");
    body.innerHTML = "";
    render(body);
    $("panel-mask").classList.remove("hidden");
    MDG.APP.sfx.ui();
  }
  function closePanel() { $("panel-mask").classList.add("hidden"); }
  const panelOpen = () => !$("panel-mask").classList.contains("hidden");

  function row(body) { return el("div", "row"); }

  /* ---------------- 行囊 ---------------- */
  function openBag() {
    const G = game.G;
    openPanel("行囊", body => {
      if (!G.items.length) body.appendChild(el("div", "muted", "行囊空空。（小卖部在 2/4/6/8 层）"));
      G.items.forEach((it, i) => {
        const def = MDG.DATA.ITEMS[it.id];
        const r = row(body);
        r.innerHTML = `<div class="grow"><b>${def.name}</b>×${it.n}<div class="muted">${def.desc}</div></div>`;
        const use = el("button", "pbtn", "用");
        use.onclick = () => {
          if (def.kind === "throw") { toast("掷出之物流需点选目标——暂从行囊掷之"); window.MDG.Input.armItem(i); closePanel(); return; }
          MDG.Input.act({ t: "item", ii: i });
          closePanel();
        };
        r.appendChild(use);
        body.appendChild(r);
      });
      const relics = el("div");
      relics.innerHTML = "<h5>刀卡（本轮有效）</h5>";
      if (!G.relics.length) relics.appendChild(el("div", "muted", "尚无刀卡。镇守与木箱有出。"));
      G.relics.forEach(id => {
        const d = MDG.DATA.RELICS[id];
        relics.appendChild(el("div", "row", `<div class="grow"><b>${d.name}</b><div class="muted">${d.desc}</div></div>`));
      });
      body.appendChild(relics);
    });
  }

  /* ---------------- 刀谱 ---------------- */
  function openBlades() {
    const G = game.G, M = game.meta;
    openPanel("刀谱", body => {
      const ch = MDG.DATA.CH(G.player.chId);
      body.appendChild(el("div", "row", `<div class="face" style="background:${ch.color}">${ch.glyph}</div>
        <div class="grow"><b>${ch.name}</b><em> ${ch.hao}</em><div class="muted">${ch.passive ? ch.passive.name + "：" + ch.passive.desc : ""}</div></div>`));
      body.appendChild(el("h5", "", "身怀之技"));
      G.player.skills.forEach((sk, i) => {
        body.appendChild(el("div", "row", `<div class="grow"><b>${sk.name}</b>${sk.cdLeft ? ' <span class="cin">冷却' + sk.cdLeft + "</span>" : ""}<div class="muted">${sk.desc}</div></div>`));
      });
      const learned = Object.keys(G.learned);
      body.appendChild(el("h5", "", "本轮录技（" + learned.length + "）"));
      if (!learned.length) body.appendChild(el("div", "muted", "白板之身。首次斩杀有名之角色，即录其技。（胜一场，录一技）"));
      learned.forEach(id => {
        const c = MDG.DATA.CH(id);
        body.appendChild(el("div", "row", `<div class="face" style="background:${c.color}">${c.glyph}</div>
          <div class="grow"><b>${c.name}</b><em> ${c.hao}</em><div class="muted">${c.bio}</div></div>`));
      });
    });
  }

  /* ---------------- 图鉴 ---------------- */
  function openDex() {
    const M = game.meta;
    openPanel("图鉴 · 地宫见闻", body => {
      body.appendChild(el("div", "muted", "斩杀过的角色入册；史料拾取入藏。"));
      const names = Object.keys(M.dex).sort();
      body.appendChild(el("h5", "", "已斩名录（" + names.length + "）"));
      names.forEach(id => {
        const c = MDG.DATA.CH(id);
        if (c) body.appendChild(el("div", "row", `<div class="face" style="background:${c.color}">${c.glyph}</div>
          <div class="grow"><b>${c.name}</b><em> ${c.hao}</em> ×${M.dex[id]}<div class="muted">${c.quote}</div></div>`));
      });
      if (!names.length) body.appendChild(el("div", "muted", "尚无。"));
      body.appendChild(el("h5", "", "史料（" + M.scrolls + "）"));
      body.appendChild(el("div", "muted", "每层藏史料二至三枚，拾之入藏，各值文脉一；集齐一层另赏三。"));
    });
  }

  /* ---------------- 修炼 ---------------- */
  function openCult(fromTitle) {
    const M = game.meta;
    openPanel("修炼 · 文脉 " + M.wemai, body => {
      body.appendChild(el("div", "muted", "文脉乃史官立言之利——每轮终局折算，可于此购永久之强。"));
      MDG.DATA.META_TREE.forEach(node => {
        const lv = MDG.Meta.treeLevel(M, node.id);
        const cost = MDG.Meta.nextCost(M, node.id);
        const r = row(body);
        r.innerHTML = `<div class="grow"><b>${node.name}</b> <span class="gold">${lv}/${node.max}</span><div class="muted">${node.desc}</div></div>`;
        const b = el("button", "pbtn", cost == null ? "已满" : "购 · " + cost);
        b.disabled = cost == null || M.wemai < cost;
        b.onclick = () => { if (MDG.Meta.buy(M, node.id)) { toast(node.name + "精进"); game.applyMetaBonuses(); openCult(fromTitle); } };
        r.appendChild(b);
        body.appendChild(r);
      });
    });
  }

  /* ---------------- 名册（选默认出战） ---------------- */
  function openRoster(cb) {
    const M = game.meta;
    openPanel("点将名册", body => {
      body.appendChild(el("div", "muted", "首次斩杀某层镇守，其人入册。点将出征——换将即换整套身法。"));
      M.runners.forEach(id => {
        const c = MDG.DATA.CH(id);
        if (!c) return;
        const sel = M.settings.runner === id;
        const r = row(body);
        r.style.cursor = "pointer";
        if (sel) r.style.borderColor = "var(--gold-bright)";
        r.innerHTML = `<div class="face" style="background:${c.color}">${c.glyph}</div>
          <div class="grow"><b>${c.name}</b><em> ${c.hao}</em>　血 ${c.hp} · 刀 ${c.dmg}<div class="muted">${c.passive ? "「" + c.passive.name + "」" + c.passive.desc : ""}${c.skill ? " · 技「" + c.skill.name + "」" : ""}</div></div>
          ${sel ? '<span class="gold">当前</span>' : "<span class='muted'>点选</span>"}`;
        r.onclick = () => { M.settings.runner = id; MDG.Meta.save(M); toast("下次入宫：" + c.name); closePanel(); if (cb) cb(); };
        body.appendChild(r);
      });
    });
  }

  /* ---------------- 商摊 ---------------- */
  function openShop() {
    const G = game.G, M = game.meta;
    openPanel("小卖部 · 地下分号", body => {
      body.appendChild(el("div", "muted", "沉在地下的小卖部还开着——零花钱：" + `<b class="gold">${G.money}</b>`));
      MDG.DATA.SHOP_STOCK.forEach(id => {
        const d = MDG.DATA.ITEMS[id];
        const r = row(body);
        r.innerHTML = `<div class="grow"><b>${d.name}</b> · ${d.price} 钱<div class="muted">${d.desc}</div></div>`;
        const b = el("button", "pbtn", "买");
        b.disabled = G.money < d.price;
        b.onclick = () => {
          if (G.money < d.price) return;
          G.money -= d.price;
          MDG.Engine.addItem(G, id);
          toast("购得「" + d.name + "」");
          MDG.APP.sfx.coin();
          openShop();
        };
        r.appendChild(b);
        body.appendChild(r);
      });
    });
  }

  /* ---------------- 设置 ---------------- */
  function openSys() {
    const M = game.meta;
    openPanel("系统", body => {
      const mute = el("button", "pbtn", M.settings.muted ? "音效：静" : "音效：响");
      mute.onclick = () => { M.settings.muted = !M.settings.muted; MDG.Meta.save(M); MDG.APP.setMuted(M.settings.muted); openSys(); };
      body.appendChild(mute);
      body.appendChild(el("div", "", "<div style='height:10px'></div>"));
      const exp = el("button", "pbtn", "导出存档");
      exp.onclick = () => {
        const data = btoa(unescape(encodeURIComponent(JSON.stringify(M))));
        prompt("存档代码（复制保存）：", data);
      };
      body.appendChild(exp);
      const imp = el("button", "pbtn", "导入存档");
      imp.onclick = () => {
        const code = prompt("粘贴存档代码：");
        if (!code) return;
        try {
          const m = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
          MDG.Meta.save(Object.assign(MDG.Meta.fresh(), m));
          toast("存档已导入");
          location.reload();
        } catch (e) { toast("存档代码无效"); }
      };
      body.appendChild(imp);
      body.appendChild(el("div", "", "<div style='height:10px'></div>"));
      const reset = el("button", "pbtn", "焚稿重开（清空局外进度）");
      reset.style.borderColor = "var(--cinnabar)"; reset.style.color = "var(--cinnabar)";
      reset.onclick = () => { if (confirm("焚稿重开：文脉、修炼、名册、图鉴皆清，且不可复元。确定？")) { MDG.Meta.save(MDG.Meta.fresh()); location.reload(); } };
      body.appendChild(reset);
      body.appendChild(el("div", "muted", "存档于 localStorage：shiji_digong_v1 / shiji_digong_run_v1"));
    });
  }

  /* ---------------- 帮助 ---------------- */
  function openHelp() {
    openPanel("观卷 · 玩法", body => {
      body.innerHTML = `
        <div style="line-height:2">
        <h5>目标</h5>深入地宫九层，斩各层镇守，第九层收卷。<br>
        <h5>操作</h5>
        · 方向键 / WASD：走一格；撞敌即刀击，撞箱/灶/梯/商摊即互动<br>
        · 数字键 1-9：用技（部分技需再点目标）　· 空格：待机　· I：行囊　· M：静音　· Esc：关面板<br>
        · 鼠标：点邻格互动；点远处自动走（见敌即停）
        <h5>规矩</h5>
        · 走一步、世界走一步。<b>急击勿失</b>：对未惊动之敌先手一刀 +2。<br>
        · <b>击破回血2</b>。胜一场，录一技——首杀有名之角色，录其技入谱。<br>
        · 每层有<b>特则</b>（顶栏红签，悬停可读）：难在机制，不在数值。<br>
        · <b>灶间</b>：血满、技冷清——进镇守房前必歇。<b>史料</b>：拾之得文脉。<br>
        · 阵亡不白死：折算<b>文脉</b>，于「修炼」购永久之强；首斩镇守者入点将名册。
        <h5>九层</h5>
        跑道之下 → 异能之窟 → 三国刀廊 → 协会堂 → 合流渊 → 禁令厅 → 神算之间 → 崇国庭 → 终焉之庭
        </div>`;
    });
  }

  /* ---------------- 终局结算 ---------------- */
  function showEnd(res, holdHidden) {
    const s = res.summary, r = res.result;
    const box = $("end-box");
    box.innerHTML = "";
    const h2 = el("h2", s.won ? "" : "lost", s.won ? "刀史收卷" : "搁笔");
    box.appendChild(h2);
    const add = (k, v) => box.appendChild(el("div", "line", `<span>${k}</span><b>${v}</b>`));
    add("所至", "第" + ["一", "二", "三", "四", "五", "六", "七", "八", "九"][Math.min(8, s.bestFloor - 1)] + "层 · " + s.floorName);
    add("难度", { easy: "简单", normal: "普通", hard: "困难", extreme: "极难", nightmare: "噩梦" }[s.diff] || s.diff);
    add("斩杀", s.kills + "（精英 " + s.eliteKills + "）");
    if (s.bossKills.length) add("斩镇守", s.bossKills.join("、"));
    if (s.learned.length) add("录技", s.learned.join("、"));
    if (s.relics.length) add("刀卡", s.relics.join("、"));
    add("史料", s.scrolls + " 枚");
    box.appendChild(el("div", "line", `<span>文脉入账</span><b class="gold">+${r.earned}</b>`));
    if (r.newUnlocks.length) {
      const u = el("div", "unlocks");
      r.newUnlocks.forEach(c => u.appendChild(el("div", "row", `<div class="face" style="background:${c.color}">${c.glyph}</div><div class="grow"><b>${c.name}</b><em> ${c.hao}</em> 入点将名册！</div>`)));
      box.appendChild(u);
    }
    if (r.newAchs.length) {
      const u = el("div", "unlocks");
      r.newAchs.forEach(a => u.appendChild(el("div", "row", `<div class="grow">成就 <b>「${a.name}」</b>——${a.desc}</div>`)));
      box.appendChild(u);
    }
    box.appendChild(el("div", "yueks", s.won
      ? "音克思曰：梦醒天将亮，最后一卷落笔。不写刀，写刀后面的人——写进书里的，这次真的不会消了。"
      : "音克思曰：写不动，不是忘得快，是想得深。此轮所想皆成文脉——明日再往下想。重开重开。"));
    const btns = el("div", "s-btns");
    const again = el("button", "t-btn primary", "再入宫");
    again.onclick = () => { location.hash = ""; window.MDG.Main.showSetup(); };
    const cult = el("button", "t-btn", "修炼");
    cult.onclick = () => { openCult(); };
    const back = el("button", "t-btn", "回题名");
    back.onclick = () => window.MDG.Main.showTitle();
    btns.appendChild(again); btns.appendChild(cult); btns.appendChild(back);
    box.appendChild(btns);
    if (!holdHidden) $("end-screen").classList.remove("hidden");
  }

  MDG.HUD = { bind, refreshHUD, refreshSkillbar, pushLog, openBag, openBlades, openDex, openCult, openRoster, openShop, openSys, openHelp, openPanel, closePanel, panelOpen, showEnd };
})();

</script>
<script>
/* ============================================================
 * 实验史记 · 马刀地宫 —— 手谈卷（键鼠输入）
 * 键盘：方向/WASD 走、数字用技、空格待机、I 行囊、K 刀谱、
 *       J 图鉴、M 静音、Esc 关面板。
 * 鼠标：点邻格互动；点远处自动行走（见敌即停）。
 * 挂载：MDG.Input
 * ============================================================ */
(function () {
  "use strict";
  const MDG = window.MDG;
  const { $ } = MDG.APP;

  let game = null;
  let autoWalk = null; // {path: [[x,y]...], i}
  let itemArmed = -1;  // 待掷之物的行囊序号

  function bind(g) { game = g; }

  const busy = () => !game || !game.G || game.animating || MDG.HUD.panelOpen() || game.overShown;

  function act(a) {
    if (busy()) return;
    cancelAuto();
    game.doAction(a);
  }

  function cancelAuto() { autoWalk = null; }

  /* 用技入口（技能栏/数字键共用） */
  function onSkillKey(si) {
    if (busy()) return;
    const G = game.G;
    const sk = G.player.skills[si];
    if (!sk) return;
    if (sk.cdLeft > 0) { MDG.APP.toast("「" + sk.name + "」冷却中（" + sk.cdLeft + "）"); return; }
    if (G.player.st.disarm > 0) { MDG.APP.toast("汝之技被封——" + G.player.st.disarm + "回合后方可再用"); return; }
    if (sk.kind === "unit") {
      /* 需目标：进入点选模式 */
      if (MDG.UI.armed.get() === si) { MDG.UI.armed.set(-1); return; }
      MDG.UI.armed.set(si);
      MDG.APP.toast("点选目标施「" + sk.name + "」（Esc 取消）");
      return;
    }
    act({ t: "skill", si, tx: null, ty: null });
  }

  function armItem(ii) { itemArmed = ii; MDG.APP.toast("点选掷掷目标（Esc 取消）"); }

  /* 点击画布 */
  function onCanvasClick(mx, my) {
    if (busy()) return;
    const G = game.G;
    const { cam } = getCam();
    const dpr = devicePixelRatio;
    const wx = Math.floor((mx - (cv.width / dpr / 2 - cam.x)) / 42);
    const wy = Math.floor((my - (cv.height / dpr / 2 - cam.y)) / 42);
    if (!MDG.Grid.inB(G.map, wx, wy)) return;
    /* 掷物模式 */
    if (itemArmed >= 0) {
      const a = { t: "item", ii: itemArmed, tx: wx, ty: wy };
      itemArmed = -1;
      act(a);
      return;
    }
    /* 施技点选 */
    const armed = MDG.UI.armed.get();
    if (armed >= 0) {
      const a = { t: "skill", si: armed, tx: wx, ty: wy };
      MDG.UI.armed.set(-1);
      act(a);
      return;
    }
    const d = MDG.Grid.manh(G.player.x, G.player.y, wx, wy);
    const foe = MDG.Engine.unitAt(G, wx, wy);
    if (d === 1) {
      /* 邻格：方向互动（撞敌/撞箱/撞梯……） */
      act({ t: "move", dx: wx - G.player.x, dy: wy - G.player.y });
      return;
    }
    if (d === 0) { act({ t: "wait" }); return; }
    /* 远处：自动走 */
    const path = pathTo(G, G.player.x, G.player.y, wx, wy);
    if (path) { autoWalk = { path, i: 0 }; stepAuto(); }
  }

  function getCam() {
    return { cam: MDG.UI.getCam() };
  }
  let cv = null;
  function setCanvas(c) { cv = c; }

  function pathTo(G, sx, sy, tx, ty) {
    const Gr = MDG.Grid;
    const prev = new Int32Array(G.map.w * G.map.h).fill(-1);
    const q = [sy * G.map.w + sx];
    prev[sy * G.map.w + sx] = sy * G.map.w + sx;
    while (q.length) {
      const cur = q.shift();
      const cx = cur % G.map.w, cy = (cur - cx) / G.map.w;
      if (cx === tx && cy === ty) break;
      for (const [dx, dy] of Gr.DIRS) {
        const nx = cx + dx, ny = cy + dy;
        if (!Gr.inB(G.map, nx, ny)) continue;
        const ni = ny * G.map.w + nx;
        if (prev[ni] !== -1) continue;
        if (nx === tx && ny === ty) { prev[ni] = cur; q.push(ni); continue; }
        if (!Gr.walkable(G.map, nx, ny)) continue;
        if ([Gr.CHEST, Gr.SHOP, Gr.CAMPFIRE, Gr.STAIRS].includes(Gr.at(G.map, nx, ny))) continue;
        if (MDG.Engine.unitAt(G, nx, ny)) continue;
        prev[ni] = cur; q.push(ni);
      }
    }
    const ti = ty * G.map.w + tx;
    if (prev[ti] === -1) return null;
    const path = [];
    let cur = ti;
    while (cur !== sy * G.map.w + sx) { path.push([cur % G.map.w, Math.floor(cur / G.map.w)]); cur = prev[cur]; }
    path.reverse();
    return path;
  }

  function stepAuto() {
    if (!autoWalk) return;
    if (busy()) { cancelAuto(); return; }
    const G = game.G;
    /* 见敌即停：视野内有惊动之敌 */
    const threat = G.enemies.some(u => !u.dead && u.chId !== "tree" && u.aggro &&
      G._visible && G._visible[u.x + "," + u.y]);
    if (threat) { cancelAuto(); MDG.APP.toast("见敌——自动行走止"); return; }
    const p = autoWalk;
    if (p.i >= p.path.length) { cancelAuto(); return; }
    const [nx, ny] = p.path[p.i];
    const dx = nx - G.player.x, dy = ny - G.player.y;
    if (Math.abs(dx) + Math.abs(dy) !== 1) { cancelAuto(); return; }
    game.doAction({ t: "move", dx, dy }, () => {
      if (!autoWalk) return;
      p.i++;
      if (p.i >= p.path.length) { cancelAuto(); return; }
      setTimeout(stepAuto, 70);
    });
  }

  /* 键盘 */
  function onKeyDown(e) {
    if (e.repeat) return;
    const k = e.key;
    /* 序章/尾声翻页优先 */
    if (!$("prologue-screen").classList.contains("hidden")) {
      if (k === " " || k === "Enter") { e.preventDefault(); MDG.Main.proNext(); }
      else if (k === "Escape") MDG.Main.proSkip();
      return;
    }
    const inGame = game && game.G && !game.overShown;
    if (k === "Escape") {
      if (MDG.HUD.panelOpen()) { MDG.HUD.closePanel(); return; }
      if (MDG.UI.armed.get() >= 0 || itemArmed >= 0) { MDG.UI.armed.set(-1); itemArmed = -1; return; }
      if (inGame) MDG.HUD.openSys();
      return;
    }
    if (MDG.HUD.panelOpen()) return;
    if (!inGame) return;
    const G = game.G;
    const move = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0], W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0] }[k];
    if (move) { e.preventDefault(); act({ t: "move", dx: move[0], dy: move[1] }); return; }
    if (k === " " || k === ".") { e.preventDefault(); act({ t: "wait" }); return; }
    if (/^[1-9]$/.test(k)) { onSkillKey(parseInt(k, 10) - 1); return; }
    if (k === "i" || k === "I") { MDG.HUD.openBag(); return; }
    if (k === "k" || k === "K") { MDG.HUD.openBlades(); return; }
    if (k === "j" || k === "J") { MDG.HUD.openDex(); return; }
    if (k === "m" || k === "M") {
      game.meta.settings.muted = !game.meta.settings.muted;
      MDG.Meta.save(game.meta);
      MDG.APP.setMuted(game.meta.settings.muted);
      MDG.APP.toast(game.meta.settings.muted ? "静音" : "有声");
    }
  }

  function init() {
    addEventListener("keydown", onKeyDown);
    cv = $("cv");
    setCanvas(cv);
    cv.addEventListener("click", (e) => {
      const r = cv.getBoundingClientRect();
      onCanvasClick(e.clientX - r.left, e.clientY - r.top);
    });
    $("panel-close").onclick = () => MDG.HUD.closePanel();
    $("panel-mask").addEventListener("click", (e) => { if (e.target === $("panel-mask")) MDG.HUD.closePanel(); });
  }

  MDG.Input = { bind, init, act, onSkillKey, armItem, cancelAuto };
})();

</script>
<script>
/* ============================================================
 * 实验史记 · 马刀地宫 —— 总纲卷（流程编排）
 * 标题屏 → 入宫设置（点将/难度）→ 地宫 → 终局结算 → 局外循环。
 * 每一动自动存续行档；终局经 Run.finish 折算文脉。
 * 挂载：MDG.Main
 * ============================================================ */
(function () {
  "use strict";
  const MDG = window.MDG;
  const { $, el, toast } = MDG.APP;

  const game = { G: null, meta: null, animating: false, overShown: false, busyAnim: false };

  /* ---------------- 序章 / 尾声（记忆体的世界观） ----------------
     承前作结句「写进书里的刀，不会消」——本作的地宫不是校园塌了，
     是音克思为收最后一卷、梦入卷底：九层即九层记忆。 */
  const PROLOGUE = [
    "毕业那天，wonder 躺在校门口说：写完这一场，你就毕业了。\n我答：写进书里的刀，不会消。\n——话，是说满了。",
    "回来收拾旧物的夜里，我摊开九卷旧稿，却写不出第十卷。\n写了三年的『事』：谁与谁战，胜负如何。\n可我记不清了——万震抬头时先看题还是先看人？\n仙女那一声『滚』，尾音有没有停顿？\n隔着的纸，终究不是人。",
    "那夜我在旧教室睡着。梦里校园一层层往下沉：\n操场在最上，校门在最底；\n人人还在原地，做着各自记得的事——\n万震等题，wonder 验算，头哥的陀螺没有停。\n梦里的人不会老，也不会让路。要往下走，只得一刀一刀，重新赢过。",
    "醒来天未亮，我忽然懂了最后一卷的写法：\n不写事，写人；不写刀，写刀后面的人。\n梦里每想对一处，笔下便多一行；想错的、想不动的，也不白想——都算文脉。\n于是提刀入梦。既毕业，无复有刀者——\n然记忆九层，刀声未绝。"
  ];
  const EPILOGUE = [
    "梦醒。粉笔题被晨光擦得干干净净。\n旧稿摊在桌上，最后一卷恰好落笔：\n『wonder 者，最早讲规则之人也。\n刀后面的人，这一回，写清楚了。』",
    "既毕业，无复有刀者——悲哉。\n然想清楚再写下来的刀，这次是真的不会消了。\n（刀已收，卷已合。九层记忆，来日可重走——重开重开。）"
  ];
  let proPages = null, proIdx = 0, proCb = null;
  function showPages(pages, cb) {
    proPages = pages; proIdx = 0; proCb = cb || null;
    renderPage();
    show("prologue-screen");
  }
  function renderPage() {
    $("pro-pages").innerHTML = proPages[proIdx].split("\n").map(l => "<p>" + l + "</p>").join("");
    $("pro-ind").textContent = (proIdx + 1) + " / " + proPages.length;
    $("pro-next").textContent = proIdx === proPages.length - 1 ? "合上" : "翻页";
  }
  function proEnd(cb) {
    proPages = null; proCb = null;
    $("prologue-screen").classList.add("hidden");
    if (cb) cb(); else showTitle();
  }
  function proNext() {
    if (!proPages) return;
    if (++proIdx >= proPages.length) proEnd(proCb); else renderPage();
  }
  function proSkip() { if (proPages) proEnd(proCb); }

  /* ---------------- 屏切换 ---------------- */
  function show(id) {
    ["title-screen", "setup-screen", "game-screen", "end-screen", "prologue-screen"].forEach(s => $(s).classList.add("hidden"));
    $(id).classList.remove("hidden");
  }

  function showTitle() {
    game.overShown = false; game.G = null;
    const M = MDG.Meta.load();
    game.meta = M;
    $("t-wemai").textContent = M.wemai;
    $("t-wins").textContent = M.stats.wins;
    $("t-floor").textContent = M.stats.bestFloor ? M.stats.bestFloor : "—";
    $("t-runners").textContent = M.runners.length;
    $("btn-resume").style.display = MDG.Run.hasRun() ? "" : "none";
    show("title-screen");
  }

  /* ---------------- 入宫设置 ---------------- */
  function showSetup() {
    const M = game.meta || MDG.Meta.load();
    game.meta = M;
    const grid = $("setup-runners");
    grid.innerHTML = "";
    M.runners.forEach(id => {
      const c = MDG.DATA.CH(id);
      if (!c) return;
      const card = el("div", "runner-card" + (M.settings.runner === id ? " sel" : ""));
      card.innerHTML = `<div class="face" style="background:${c.color}">${c.glyph}</div>
        <div><h4>${c.name}<em>${c.hao}</em></h4>
        <div class="meta">血 ${c.hp} · 刀 ${c.dmg} · ${c.passive ? c.passive.name : ""}${c.skill ? " · 技「" + c.skill.name + "」" : ""}</div></div>`;
      card.onclick = () => {
        M.settings.runner = id; MDG.Meta.save(M);
        grid.querySelectorAll(".runner-card").forEach(x => x.classList.remove("sel"));
        card.classList.add("sel");
      };
      grid.appendChild(card);
    });
    const diffs = $("setup-diffs");
    diffs.innerHTML = "";
    MDG.DATA.DIFFS.forEach(d => {
      const row = el("div", "diff-row" + (M.settings.diffV === d.v ? " sel" : ""));
      row.innerHTML = `<b>${d.n}</b><span>${d.tip}</span>`;
      row.onclick = () => {
        M.settings.diffV = d.v; MDG.Meta.save(M);
        diffs.querySelectorAll(".diff-row").forEach(x => x.classList.remove("sel"));
        row.classList.add("sel");
      };
      diffs.appendChild(row);
    });
    show("setup-screen");
  }

  function startRun() {
    const M = game.meta;
    game.G = MDG.Run.newRun({ runnerId: M.settings.runner, diffV: M.settings.diffV });
    enterGame(true);
  }
  function resumeRun() {
    const G = MDG.Run.loadRun();
    if (!G) { toast("无续行之局"); return; }
    game.G = G;
    game.meta = MDG.Meta.load();
    enterGame(false);
  }

  function enterGame(fresh) {
    game.overShown = false;
    MDG.UI.init();
    MDG.Input.bind(game);
    MDG.HUD.bind(game);
    applyMetaBonuses();
    MDG.UI.updateFov(game.G);
    show("game-screen");
    MDG.HUD.refreshHUD();
    MDG.HUD.refreshSkillbar();
    MDG.UI.showFloorCard(game.G);
    if (fresh) toast("入第" + ["一", "二", "三", "四", "五", "六", "七", "八", "九"][game.G.floorIdx] + "层 · " + game.G.floorDef.name);
    if (!mainLoop) { mainLoop = true; requestAnimationFrame(loop); }
  }

  function applyMetaBonuses() {
    game.G._metaBonuses = MDG.Meta.bonuses(game.meta);
  }

  /* ---------------- 动作主线 ---------------- */
  function doAction(a, done) {
    if (game.animating || game.overShown) { if (done) done(); return; }
    const G = game.G;
    const evs = MDG.Engine.act(G, a);
    consumeEvents(evs);
    afterAction(done);
  }

  function consumeEvents(evs) {
    MDG.UI.playEvents(game.G, evs);
    MDG.HUD.pushLog(evs);
    evs.forEach(e => {
      if (e.t === "shop") { MDG.HUD.openShop(); }
      if (e.t === "learn") { MDG.HUD.refreshSkillbar(); }
      if (e.t === "descend") { applyMetaBonuses(); }
    });
  }

  function afterAction(done) {
    const G = game.G;
    MDG.UI.updateFov(G);
    MDG.HUD.refreshHUD();
    MDG.HUD.refreshSkillbar();
    MDG.Run.saveRun(G);
    if ((G.over || G.won) && !game.overShown) {
      game.overShown = true;
      MDG.Run.clearRun();
      setTimeout(() => finishRun(), 900);
    }
    if (done) done();
  }

  function finishRun() {
    const res = MDG.Run.finish(game.G);
    game.meta = res.meta;
    if (res.summary.won) {
      /* 收卷：先播「梦醒」尾声，再上结算 */
      MDG.HUD.showEnd(res, true);      // 渲染但先不显示
      showPages(EPILOGUE, () => { $("end-screen").classList.remove("hidden"); });
    } else {
      MDG.HUD.showEnd(res);
    }
  }

  /* ---------------- 主循环 ---------------- */
  let mainLoop = false;
  function loop(now) {
    if (game.G) MDG.UI.draw(game.G, now || performance.now());
    requestAnimationFrame(loop);
  }

  /* ---------------- 装配 ---------------- */
  function boot() {
    MDG.Input.init();
    const M = MDG.Meta.load();
    MDG.APP.setMuted(M.settings.muted);
    $("btn-new").onclick = () => {
      game.meta = MDG.Meta.load();
      if (!game.meta.flags.prologueSeen) {
        showPages(PROLOGUE, () => {
          game.meta.flags.prologueSeen = true;
          MDG.Meta.save(game.meta);
          showSetup();
        });
      } else showSetup();
    };
    $("btn-why").onclick = () => showPages(PROLOGUE, showTitle);
    $("pro-next").onclick = proNext;
    $("pro-skip").onclick = proSkip;
    $("btn-resume").onclick = resumeRun;
    $("btn-cult").onclick = () => { game.meta = MDG.Meta.load(); MDG.HUD.bind(game); MDG.HUD.openCult(); };
    $("btn-help").onclick = () => { MDG.HUD.bind(game); MDG.HUD.openHelp(); };
    $("btn-start").onclick = startRun;
    $("btn-setup-back").onclick = showTitle;
    $("btn-bag").onclick = () => MDG.HUD.openBag();
    $("btn-blades").onclick = () => MDG.HUD.openBlades();
    $("btn-dex").onclick = () => MDG.HUD.openDex();
    $("btn-sys").onclick = () => MDG.HUD.openSys();
    MDG.HUD.bind(game);
    showTitle();
  }

  game.doAction = doAction;
  game.applyMetaBonuses = applyMetaBonuses;

  MDG.Main = {
    boot, showTitle, showSetup, enterGame,
    proNext, proSkip, proActive: () => !!proPages,
    get game() { return game; }
  };
  addEventListener("DOMContentLoaded", boot);
})();

</script>
